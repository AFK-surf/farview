[package]
name = "webgl"
version = "0.1.0"
license = "MIT"

[dependencies]
glsl = { path = "../glsl" }

[link]
c_sources = ["../../../native/page/webgl_gl.c", "pion_webgl_bridge.c"]
cc_flags = ["-O2"]

[link.linux]
libs = ["dl", "m"]

[link.windows]
cc_flags = ["-D_CRT_SECURE_NO_WARNINGS", "-D_CRT_NONSTDC_NO_DEPRECATE"]
libs = ["user32", "gdi32"]
