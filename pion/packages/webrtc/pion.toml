[package]
name = "webrtc"
version = "0.1.0"
license = "MIT"

[dependencies]
fv_sdp = { path = "./sdp" }
fv_stun = { path = "./stun" }
fv_rtp = { path = "./rtp" }
media = { path = "../media" }

[link]
c_sources = ["../../../native/page/av_macos.c", "../../../native/page/webrtc_native.c", "pion_webrtc_bridge.c"]
cc_flags = ["-O2"]

[link.macos]
objects = ["../../../deps/curl-impersonate/libcurl-impersonate.a"]
libs = ["resolv", "z", "iconv", "c++"]
frameworks = ["CoreFoundation", "Security"]

[link.linux]
objects = ["../../../deps/curl-impersonate/libcurl-impersonate.a"]
libs = ["resolv", "z", "pthread", "dl", "m", "stdc++"]

[link.windows]
cc_flags = ["-D_CRT_SECURE_NO_WARNINGS", "-D_CRT_NONSTDC_NO_DEPRECATE"]
objects = [
  "../../../deps/curl-impersonate/lib/curl-impersonate/ssl.lib",
  "../../../deps/curl-impersonate/lib/curl-impersonate/crypto.lib",
]
libs = ["ws2_32", "advapi32", "bcrypt", "crypt32", "iphlpapi"]
