[package]
name = "fetch"
version = "0.1.0"
license = "MIT"

[dependencies]
url = { path = "../url" }
encoding = { path = "../encoding" }
mime = { path = "../mime" }
http_cache = { path = "../http_cache" }

[link]
c_sources = ["../../../native/fetch/fetch.c", "../../../native/fetch/ws.c", "pion_fetch_bridge.c"]
cc_flags = ["-O2", "-Ic_compat", "-I../../../deps/curl-impersonate/include"]

[link.macos]
objects = ["../../../deps/curl-impersonate/libcurl-impersonate.a"]
frameworks = ["CoreFoundation", "Security", "CoreServices", "ImageIO", "CoreGraphics"]
libs = ["resolv", "icucore", "iconv", "z"]

[link.linux]
# Linux glibc provides iconv; curl-impersonate static archive follows the same deps/ layout.
objects = ["../../../deps/curl-impersonate/libcurl-impersonate.a"]
libs = ["resolv", "z", "pthread", "dl", "m"]
