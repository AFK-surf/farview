[package]
name = "fetch"
version = "0.1.0"
license = "MIT"

[dependencies]
url = { path = "../url" }
encoding = { path = "../encoding" }
mime = { path = "../mime" }
http_cache = { path = "../http_cache" }

[link]
c_sources = ["../../../native/fetch/fetch.c", "../../../native/fetch/ws.c", "pion_fetch_bridge.c"]
cc_flags = ["-O2", "-Ic_compat", "-I../../../deps/curl-impersonate/include"]

[link.macos]
objects = ["../../../deps/curl-impersonate/libcurl-impersonate.a"]
frameworks = ["CoreFoundation", "Security", "CoreServices", "ImageIO", "CoreGraphics"]
libs = ["resolv", "icucore", "iconv", "z"]

[link.linux]
# Linux glibc provides iconv; curl-impersonate static archive follows the same deps/ layout.
objects = ["../../../deps/curl-impersonate/libcurl-impersonate.a"]
libs = ["resolv", "z", "pthread", "dl", "m"]

[link.windows]
cc_flags = ["-DCURL_STATICLIB", "-D_CRT_SECURE_NO_WARNINGS"]
flags = ["-Wl,/nodefaultlib:volatileaccessu.lib"]
objects = [
  "../../../deps/curl-impersonate/lib/libcurl-impersonate.lib",
  "../../../deps/curl-impersonate/lib/curl-impersonate/cares.lib",
  "../../../deps/curl-impersonate/lib/curl-impersonate/ssl.lib",
  "../../../deps/curl-impersonate/lib/curl-impersonate/crypto.lib",
  "../../../deps/curl-impersonate/lib/curl-impersonate/zs.lib",
  "../../../deps/curl-impersonate/lib/curl-impersonate/brotlidec.lib",
  "../../../deps/curl-impersonate/lib/curl-impersonate/brotlicommon.lib",
  "../../../deps/curl-impersonate/lib/curl-impersonate/zstd_static.lib",
  "../../../deps/curl-impersonate/lib/curl-impersonate/nghttp2.lib",
  "../../../deps/curl-impersonate/lib/curl-impersonate/ngtcp2.lib",
  "../../../deps/curl-impersonate/lib/curl-impersonate/ngtcp2_crypto_boringssl.lib",
  "../../../deps/curl-impersonate/lib/curl-impersonate/nghttp3.lib",
]
libs = ["ws2_32", "advapi32", "iphlpapi", "crypt32", "normaliz", "bcrypt"]
