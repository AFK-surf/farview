[package]
name = "webauthn"
version = "0.1.0"
license = "MIT"

[link]
c_sources = ["../../../native/page/webauthn.c", "pion_webauthn_bridge.c"]
cc_flags = ["-O2", "-Ic_compat"]

[link.macos]
objects = ["../../../deps/curl-impersonate/libcurl-impersonate.a"]
frameworks = ["CoreFoundation", "Security", "CoreServices"]
libs = ["resolv", "icucore", "iconv", "z", "c++"]

[link.linux]
objects = ["../../../deps/curl-impersonate/libcurl-impersonate.a"]
libs = ["resolv", "z", "pthread", "dl", "m", "stdc++"]

[link.windows]
cc_flags = ["-D_CRT_SECURE_NO_WARNINGS", "-D_CRT_NONSTDC_NO_DEPRECATE"]
objects = ["../../../deps/curl-impersonate/lib/curl-impersonate/crypto.lib"]
libs = ["ws2_32", "advapi32", "bcrypt", "crypt32"]
