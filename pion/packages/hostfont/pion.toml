[package]
name = "hostfont"
version = "0.1.0"
license = "MIT"

[link]
c_sources = ["../../../native/hostfont/coretext.c", "pion_hostfont_bridge.c"]
cc_flags = ["-O2", "-Ic_compat"]

[link.macos]
frameworks = ["CoreText", "CoreGraphics", "CoreFoundation"]

[link.linux]
# On Linux, coretext.c compiles #ifndef __APPLE__ no-op stubs and hostfont scans
# /usr/share/fonts and /usr/local/share/fonts directly (no CoreText/FreeType required).
libs = ["m"]

[link.windows]
cc_flags = ["-D_CRT_SECURE_NO_WARNINGS", "-D_CRT_NONSTDC_NO_DEPRECATE"]
