[package]
name = "page_aux"
version = "0.1.0"
license = "MIT"

[dependencies]
url = { path = "../url" }
html = { path = "../html" }
fetch = { path = "../fetch" }
raster = { path = "../raster" }
webauthn = { path = "../webauthn" }

[link]
c_sources = ["../../../native/page/storage_sqlite.c", "../../../native/page/sandbox.c", "../../../native/page/native_messaging.c"]
cc_flags = ["-O2"]

[link.linux]
libs = ["dl", "pthread"]

[link.windows]
cc_flags = ["-D_CRT_SECURE_NO_WARNINGS", "-D_CRT_NONSTDC_NO_DEPRECATE"]
libs = ["ws2_32", "advapi32"]
