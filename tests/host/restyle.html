<!doctype html>
<title>restyle</title>
<style>
.a .b { color: rgb(255, 0, 0) }
.x + .y { color: rgb(0, 0, 255) }
.p:has(.q) .r { color: rgb(0, 128, 0) }
.s:has(> .t) { color: rgb(128, 0, 128) }
li:first-child { color: rgb(1, 2, 3) }
.e:empty { color: rgb(255, 165, 0) }
[data-k="v"] .z { color: rgb(4, 5, 6) }
.m:has([style*="none"]) { color: rgb(7, 8, 9) }
.h:has(*) { color: rgb(10, 11, 12) }
.w:has(+ .t2) { color: rgb(13, 14, 15) }
.f:has(> .g:first-child) { color: rgb(16, 17, 18) }
</style>
<body>
<div id=a><span class=b id=b>b</span></div>
<div id=x></div><div class=y id=y>y</div>
<div class=p id=p><i id=qhere></i><span class=r id=r>r</span></div>
<div class=s id=s></div>
<ul id=ul><li id=l1>1</li><li id=l2>2</li></ul>
<div class=e id=e>text</div>
<div id=k><span class=z id=z>z</span></div>
<div class=m id=m><span id=ms></span></div>
<div class=h id=h></div>
<div><div class=w id=w></div><div id=after></div></div>
<div class=f id=f><i id=f1></i><b class=g>g</b></div>
<script>
// each element's color after a change, with a layout before it (what elements matched is kept from one to the next)
const $ = (id) => document.getElementById(id);
const col = (id) => getComputedStyle($(id)).color;
const lay = () => document.body.getBoundingClientRect();
const res = [];
const step = (change, id) => { lay(); change(); lay(); res.push(col(id)); };
step(() => $("a").className = "a", "b");                          // rgb(255, 0, 0)
step(() => $("x").className = "x", "y");                          // rgb(0, 0, 255)
step(() => $("qhere").className = "q", "r");                      // rgb(0, 128, 0)
step(() => $("s").appendChild(Object.assign(document.createElement("b"), { className: "t" })), "s"); // rgb(128, 0, 128)
step(() => $("l1").remove(), "l2");                               // rgb(1, 2, 3)
step(() => $("e").firstChild.remove(), "e");                      // rgb(255, 165, 0)
step(() => $("k").setAttribute("data-k", "v"), "z");              // rgb(4, 5, 6)
step(() => $("ms").setAttribute("style", "display: none"), "m");  // rgb(7, 8, 9)
step(() => $("h").appendChild(document.createElement("p")), "h"); // rgb(10, 11, 12)
step(() => $("w").after(Object.assign(document.createElement("p"), { className: "t2" })), "w"); // rgb(13, 14, 15)
step(() => $("f1").remove(), "f");                                // rgb(16, 17, 18)
step(() => $("a").className = "", "b");                           // rgb(0, 0, 0)
</script>
