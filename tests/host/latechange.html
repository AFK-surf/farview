<!doctype html>
<title>late change</title>
<body style="margin:0">
<p>first</p>
<script>
// a change a script makes and then measures: the measuring lays the page out, and the change must still be drawn
setTimeout(() => {
  const d = document.createElement("div");
  d.style.cssText = "width:200px;height:200px;background:#00f";
  d.textContent = "later";
  document.body.appendChild(d);
  document.title = "changed " + d.getBoundingClientRect().height;
}, 1000);
</script>
</body>
