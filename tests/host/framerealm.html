<!doctype html>
<title>none</title>
<!-- a same-origin frame's document reached from the page is the frame's own: its nodes are the objects its scripts
     hold, so what they put on them (a framework's value tracker, its listeners) sees what the page does to them -->
<iframe id=f src="framerealm-child.html"></iframe>
<script>
window.onload = () => {
  const f = document.getElementById("f");
  const d = f.contentDocument;
  const t = d.querySelector("input");
  t.value = "typed";
  t.dispatchEvent(new f.contentWindow.Event("input", { bubbles: true }));
  document.title = [d === f.contentWindow.document, d.body.dataset.seen, t._tracked === true].join(" ");
};
</script>
