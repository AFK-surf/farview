<!doctype html><title>f</title>
<iframe name=tgt></iframe>
<form id=f action="a.html" target=tgt method=get><input name=q value="x y"></form>
<script>
// a form sent into a frame its target names: the frame shows the answer, its load comes after
const out = [];
const fr = document.querySelector("iframe");
fr.addEventListener("load", () => {
  const d = fr.contentDocument;
  out.push("load " + (d ? d.title : "-"));
  document.title = out.join(" | ");
});
document.getElementById("f").submit();
out.push("submitted");
document.title = out.join(" | ");
</script>
