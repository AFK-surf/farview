<!doctype html>
<title>storage</title>
<script>
// localStorage outlives the page and the connection: each visit counts one more; items read as properties too
localStorage.visits = String(Number(localStorage.getItem("visits") || 0) + 1);
document.title = "visits " + localStorage.visits + " " + ("visits" in localStorage) + " " + Object.keys(localStorage).join(",");
</script>
