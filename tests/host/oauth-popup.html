<!doctype html><html><head><meta charset="utf-8"><title>popup</title></head><body>
<pre id="out">popup</pre>
<script>
// the provider's callback page: the token to the page that opened it (its origin given in the address), a message for
// another origin that must not arrive, then closed
const to = decodeURIComponent(location.search.slice(1));
window.__opener = { has: !!window.opener, type: typeof (window.opener && window.opener.postMessage) };
window.opener.postMessage({ token: 'wrong-origin' }, 'https://elsewhere.example');
window.opener.postMessage({ token: 'ok-123' }, to);
window.addEventListener('message', e => { document.getElementById('out').textContent = 'from opener: ' + JSON.stringify(e.data); });
setTimeout(() => window.close(), 100);
</script></body></html>
