<!doctype html>
<title>scrollto</title>
<body style="margin:0">
<div style="height:3000px">tall</div>
<div id=target style="height:50px">target</div>
<div style="height:3000px"></div>
<script>
// the page scrolls itself: by scrollTo, then to an element; each time its scripts see where it is at once
const seen = [];
document.addEventListener("scroll", () => seen.push(Math.round(scrollY)));
scrollTo(0, 500);
seen.push(document.scrollingElement.scrollTop);
setTimeout(() => {
  document.getElementById("target").scrollIntoView();
  setTimeout(() => { document.title = "scrolled " + scrollY + " " + seen.join(","); }, 0);
}, 0);
</script>
