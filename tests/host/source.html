<!doctype html>
<title>none</title>
<!-- a message's source is the window that sent it, which can be answered: the frame (?frame=URL) answers the page's
     message on e.source, and the page answers the frame's own message on e.source -->
<script>
const got = [];
const show = s => { got.push(s); document.title = got.sort().join("|"); };
addEventListener("message", e => {
  if (String(e.data).startsWith("re ")) show(e.data);
  else if (e.data === "hello") { show("from frame " + (e.source === f.contentWindow)); e.source.postMessage("back", "*"); }
});
const f = document.createElement("iframe");
f.src = new URLSearchParams(location.search).get("frame");
f.onload = () => f.contentWindow.postMessage("ping", "*");
document.body.appendChild(f);
f.getBoundingClientRect();
</script>
