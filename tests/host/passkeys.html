<!doctype html>
<html><head><meta charset="utf-8"><title>passkeys</title>
<script>
// What tools/passkeys.sh asks of the page: a passkey made, a sign-in with one, each checked as a relying party checks it
const b64u = b => { const u = b instanceof ArrayBuffer ? new Uint8Array(b) : b; let s = ""; for (const x of u) s += String.fromCharCode(x); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
const unb64u = s => { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
const cat = (a, b) => { const o = new Uint8Array(a.length + b.length); o.set(a); o.set(b, a.length); return o; };
// an ASN.1 DER ECDSA signature as WebCrypto takes it: r and s, 32 bytes each
function rawSig(der) {
  let i = 2; const parts = [];
  for (let k = 0; k < 2; k++) { i++; const n = der[i++]; let v = der.slice(i, i + n); i += n; while (v.length > 32 && v[0] === 0) v = v.slice(1); const p = new Uint8Array(32); p.set(v, 32 - v.length); parts.push(p); }
  return cat(parts[0], parts[1]);
}
async function signIn(rpId, ids) {
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  const c = await navigator.credentials.get({ publicKey: { challenge, rpId, allowCredentials: ids.map(id => ({ type: "public-key", id: unb64u(id) })), userVerification: "required" } });
  const r = c.response, cd = JSON.parse(new TextDecoder().decode(r.clientDataJSON));
  return { id: c.id, rawId: b64u(c.rawId), type: c.type, attachment: c.authenticatorAttachment, isPKC: c instanceof PublicKeyCredential, isAssertion: r instanceof AuthenticatorAssertionResponse,
    auth: b64u(r.authenticatorData), cdata: b64u(r.clientDataJSON), sig: b64u(r.signature), user: r.userHandle ? b64u(r.userHandle) : null,
    challengeOk: cd.challenge === b64u(challenge), cdType: cd.type, origin: cd.origin, flags: new Uint8Array(r.authenticatorData)[32],
    count: new DataView(r.authenticatorData).getUint32(33), ext: JSON.stringify(c.getClientExtensionResults()), json: c.toJSON() };
}
async function verify(spki, a) {
  const key = await crypto.subtle.importKey("spki", unb64u(spki), { name: "ECDSA", namedCurve: "P-256" }, false, ["verify"]);
  const data = cat(unb64u(a.auth), new Uint8Array(await crypto.subtle.digest("SHA-256", unb64u(a.cdata))));
  return crypto.subtle.verify({ name: "ECDSA", hash: "SHA-256" }, key, rawSig(unb64u(a.sig)), data);
}
async function register(rpId, name) {
  const c = await navigator.credentials.create({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { id: rpId, name: "Test" },
    user: { id: new TextEncoder().encode("user-" + name), name, displayName: name }, pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
    authenticatorSelection: { residentKey: "required", userVerification: "required" } } });
  const r = c.response, cd = JSON.parse(new TextDecoder().decode(r.clientDataJSON)), auth = new Uint8Array(r.getAuthenticatorData());
  return { id: c.id, spki: b64u(r.getPublicKey()), alg: r.getPublicKeyAlgorithm(), att: b64u(r.attestationObject), auth: b64u(auth), cdType: cd.type, origin: cd.origin,
    flags: auth[32], transports: r.getTransports(), isAttestation: r instanceof AuthenticatorAttestationResponse, json: c.toJSON() };
}
async function checks() {
  return [await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(), await PublicKeyCredential.isConditionalMediationAvailable(),
    typeof PublicKeyCredential.parseRequestOptionsFromJSON, typeof navigator.credentials.create];
}
</script></head><body><p>passkeys</p></body></html>
