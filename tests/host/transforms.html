<!doctype html>
<meta name="viewport" content="width=device-width">
<title>transforms</title>
<style>
  body { margin: 0; font: 16px sans-serif; }
  .row { position: relative; height: 130px; border-bottom: 1px solid #ccc; }
  .box { position: absolute; top: 25px; width: 80px; height: 80px; background: #2563eb; }
  .t1 { left: 20px; transform: rotate(45deg); }
  .t2 { left: 150px; transform: scale(0); background: #dc2626; }
  .t3 { left: 280px; transform: scale(0.5) translateX(40px); background: #16a34a; }
  .t4 { left: 50%; top: 50%; transform: translate(-50%, -50%) skewX(20deg); background: #9333ea; }
  .t5 { rotate: 90deg; transform-origin: 0 0; width: 100px; height: 40px; top: 10px; left: 200px; background: #ea580c; }
  .chev { position: absolute; left: 280px; top: 30px; font-size: 48px; transform: rotate(180deg); }
  .t6 { left: 20px; transform: matrix(1, 0.3, 0, 1, 0, 0); background: #0891b2; }
</style>
<div class="row"><div class="box t1"></div><div class="box t2"></div><div class="box t3"></div></div>
<div class="row"><div class="box t4">Hi</div></div>
<div class="row"><div class="box t5"></div><div class="chev">&gt;</div><div class="box t6"></div></div>
