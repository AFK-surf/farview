<!doctype html>
<title>scrollbtn</title>
<meta name=viewport content="width=device-width">
<body style="margin:0;font:20px sans-serif">
<!-- a button that scrolls the page to section 3 by itself, as "back to top" and table-of-contents links do -->
<button id=go style="font-size:28px;padding:20px;margin:20px" onclick="document.getElementById('s3').scrollIntoView()">Go to section 3</button>
<div style="height:1200px;background:#cde">section 1</div>
<div style="height:1200px;background:#dec">section 2</div>
<div id=s3 style="height:1200px;background:#fdb;font-size:40px">section 3 is here</div>
<script>
// (on the device: a tap on the button scrolls; and the page scrolls itself to section 2 by a timer, 33 s on)
let tapped = false;
document.getElementById("go").addEventListener("click", () => { tapped = true; document.title = "tapped"; });
setTimeout(() => { if (!tapped) scrollTo(0, 1300); }, 33000);
</script>
</body>
