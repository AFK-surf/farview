<!doctype html>
<title>none</title>
<!-- a port sent along with a message (its transfer list) arrives with it, and answers come back on the other end: to
     the page itself, to a worker with the port inside the message too, and to a frame of another origin -->
<script>
const got = [];
const show = s => { got.push(s); document.title = got.sort().join("|"); };
const c = new MessageChannel();
addEventListener("message", e => { if (e.ports[0]) e.ports[0].postMessage("pong " + e.data); });
c.port1.onmessage = e => show(e.data);
postMessage("ping", "*", [c.port2]);
const w = new Worker(URL.createObjectURL(new Blob(["onmessage = e => e.data.port.postMessage('w ' + e.data.n + ' ' + (e.ports[0] === e.data.port));"])));
const d = new MessageChannel();
d.port1.onmessage = e => show(e.data);
w.postMessage({ n: 1, port: d.port2 }, [d.port2]);
// (?frame=URL: a frame of another origin gets one too)
// (?frame=data: a data: document, which is of an origin of its own)
const frameArg = new URLSearchParams(location.search).get("frame");
const frameUrl = frameArg === "data" ? "data:text/html,<script>onmessage = e => e.ports[0].postMessage('f ' + e.data);</" + "script>" : frameArg;
if (frameUrl) {
  const f = document.createElement("iframe");
  f.src = frameUrl;
  f.onload = () => { const g = new MessageChannel(); g.port1.onmessage = e => show(e.data); f.contentWindow.postMessage("hi", "*", [g.port2]); };
  document.body.appendChild(f);
  // (laid out, as a shown page is: a frame of another origin is asked for at its page's layout)
  f.getBoundingClientRect();
}
</script>
