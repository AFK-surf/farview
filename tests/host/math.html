<!doctype html><title>t</title>
<div style="position: relative; width: 100px; font-size: 20px"><div id=a></div></div>
<script>
// CSS math functions in computed values: numbers, integers, lengths, angles and times; lh and rlh
const a = document.getElementById("a"), res = [];
for (const [p, v] of [["z-index", "round(2.6)"], ["z-index", "calc(mod(-1, 3) + rem(-7, 3))"], ["scale", "calc(sin(90deg) + pow(2, 3))"],
    ["margin-left", "round(up, 21px, 5px)"], ["margin-left", "calc(abs(-1em) + hypot(3px, 4px))"], ["rotate", "atan2(1, 1)"],
    ["transition-delay", "clamp(1s, 5000ms, 3s)"], ["opacity", "calc(sign(-2) * -0.5)"], ["width", "calc(50% + 10px)"], ["margin-left", "calc(2lh + 1rlh)"]]) {
  a.style.position = "absolute";
  a.style.lineHeight = "10px";
  a.style.setProperty(p, v);
  res.push(getComputedStyle(a).getPropertyValue(p));
}
document.title = res.join(" | ");
</script>
