<!doctype html>
<title>canvas</title>
<body style="margin:0">
<canvas id=c width=200 height=120></canvas>
<canvas id=s width=20 height=20 style="display:none"></canvas>
<script>
// what each drawing leaves in the canvas's pixels, read back (res: one entry per check)
const c = document.getElementById("c").getContext("2d");
const px = (x, y) => Array.from(c.getImageData(x, y, 1, 1).data).join(",");
const res = [];
c.fillStyle = "red"; c.fillRect(10, 10, 40, 40);
res.push(px(20, 20));                                   // 255,0,0,255
c.save(); c.translate(100, 0); c.fillStyle = "rgb(0, 0, 255)"; c.beginPath(); c.arc(30, 30, 20, 0, Math.PI * 2); c.fill(); c.restore();
res.push(px(130, 30), px(100, 5));                      // blue in the circle, clear outside
c.clearRect(15, 15, 10, 10);
res.push(px(20, 20));                                   // cleared: 0,0,0,0
// a clip: only its inside is drawn
c.save(); c.beginPath(); c.rect(60, 60, 20, 20); c.clip(); c.fillStyle = "#0f0"; c.fillRect(50, 50, 50, 50); c.restore();
res.push(px(70, 70), px(55, 55));                       // green inside, clear outside
// a canvas drawn onto another, scaled
const s = document.getElementById("s").getContext("2d"); s.fillStyle = "#ff0"; s.fillRect(0, 0, 20, 20);
c.drawImage(document.getElementById("s"), 150, 80, 40, 40);
res.push(px(185, 115));                                 // yellow
// putImageData puts as it is
const d = c.createImageData(2, 2); for (let i = 0; i < 16; i += 4) { d.data[i] = 10; d.data[i + 1] = 20; d.data[i + 2] = 30; d.data[i + 3] = 255; }
c.putImageData(d, 0, 100);
res.push(px(1, 101));                                   // 10,20,30,255
// a gradient across a stroke
const g = c.createLinearGradient(0, 0, 200, 0); g.addColorStop(0, "black"); g.addColorStop(1, "white");
c.strokeStyle = g; c.lineWidth = 6; c.beginPath(); c.moveTo(0, 90); c.lineTo(200, 90); c.stroke();
res.push(px(100, 90).split(",")[3]);                    // drawn: alpha 255
res.push(document.getElementById("c").toDataURL().slice(0, 22));
// text, shaped with the page's fonts: inked where it stands, as wide as measured
c.font = "bold 20px sans-serif"; c.fillStyle = "#000"; c.fillText("Hi", 60, 115);
const w = c.measureText("Hi").width, ink = c.getImageData(60, 95, 40, 22).data;
let inked = 0; for (let i = 3; i < ink.length; i += 4) if (ink[i] > 128) inked++;
res.push(w > 15 && w < 30 ? "measured" : "width " + w, inked > 40 ? "inked" : "ink " + inked);
</script>
