<!doctype html>
<title>none</title>
<!-- a script a page inserts runs as a script, not as an eval: its top-level var is the window's even under "use strict"
     (Bing's results declare var sa_config so), and a string timer's too -->
<script>
const s = document.createElement("script");
s.textContent = '"use strict"; var fromStrict = 1; function fnStrict() { return 2; }';
document.head.appendChild(s);
setTimeout('"use strict"; var fromTimer = 3;', 0);
setTimeout(() => { document.title = [typeof fromStrict, typeof fnStrict, typeof fromTimer, window.fromStrict].join(" "); }, 10);
</script>
