<!doctype html>
<title>none</title>
<!-- a popover a button shows and hides, the events it fires, and a modal dialog closed by its form -->
<button id=b popovertarget=p>menu</button>
<div id=p popover>items</div>
<dialog id=d><form method=dialog><button id=ok value=yes>ok</button></form></dialog>
<script>
const r = [], p = document.getElementById("p"), d = document.getElementById("d");
const disp = () => getComputedStyle(p).display;
p.addEventListener("beforetoggle", e => r.push("before " + e.newState));
p.addEventListener("toggle", e => r.push("toggle " + e.oldState + ">" + e.newState));
r.push(disp());
document.getElementById("b").click();
r.push(disp(), p.matches(":popover-open"), getComputedStyle(p).position);
d.showModal();
r.push(d.matches(":modal"), d.open, p.matches(":popover-open"));
d.addEventListener("close", () => { r.push("closed " + d.returnValue, d.matches(":modal")); document.title = r.join(" "); });
document.getElementById("ok").click();
</script>
