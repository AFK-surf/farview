<!doctype html><script>
// a worker's imported scripts share its scope: what one declares (a function, a var) the importer calls after
const lib = URL.createObjectURL(new Blob(["function triple(x) { return 3 * x; } var base = 1;"]));
const w = new Worker(URL.createObjectURL(new Blob(["importScripts(" + JSON.stringify(lib) + " /* ) */); onmessage = e => postMessage(triple(e.data) + base);"])));
w.onmessage = e => { window.res = String(e.data); window.__wpt = 1; };
w.postMessage(5);
</script>
