<!doctype html><title>t</title>
<style>#b { width: 100px; height: 20px; background-color: rgb(0, 0, 0); transition: background-color 1s linear, width 1s linear; } #b.on { background-color: rgb(200, 100, 0); width: 300px; }</style>
<div id=b></div>
<script>
// a transition started by a class change: its value halfway, then its events in order
const b = document.getElementById("b"), res = [];
for (const t of ["transitionrun", "transitionstart", "transitionend"]) b.addEventListener(t, e => res.push(e.type + ":" + e.propertyName + ":" + e.elapsedTime));
getComputedStyle(b).width;
b.className = "on";
res.push(getComputedStyle(b).width);
setTimeout(() => res.push(getComputedStyle(b).backgroundColor + " " + getComputedStyle(b).width), 500);
setTimeout(() => { res.push(getComputedStyle(b).width); document.title = res.join(" | "); }, 1200);
</script>
