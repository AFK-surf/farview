<!doctype html>
<html><head><meta charset=utf-8><title>Stage 7</title>
<style>
body { margin: 0; padding: 24px; font: 16px Arial, sans-serif; color: #1d1d1f; background: #fff; }
label { display: block; font-size: 13px; color: #6e6e73; margin: 0 0 6px; }
select { display: block; width: 260px; height: 36px; font-size: 16px; margin: 0 0 8px; }
#said { font-size: 13px; color: #0a7a3d; margin: 0 0 28px; height: 18px; }
#note { width: 320px; min-height: 72px; padding: 8px; border: 1px solid #c7c7cc; border-radius: 8px; }
#log { font-size: 13px; color: #6e6e73; margin-top: 8px; }
</style></head>
<body>
<label for=city>城市</label>
<select id=city>
  <optgroup label="中国">
    <option>北京</option>
    <option selected>上海</option>
    <option disabled>拉萨（暂不支持）</option>
  </optgroup>
  <optgroup label="日本">
    <option>東京</option>
    <option>大阪</option>
  </optgroup>
</select>
<div id=said>当前：上海</div>
<label>备注</label>
<div id=note contenteditable>你好，</div>
<div id=log>还没有粘贴</div>
<script>
const s = document.getElementById('city'), said = document.getElementById('said');
s.addEventListener('change', () => { said.textContent = '当前：' + s.value + '（change 事件）'; });
document.getElementById('note').addEventListener('paste', e => {
  document.getElementById('log').textContent = '粘贴了：' + e.clipboardData.getData('text/plain');
});
</script>
</body></html>
