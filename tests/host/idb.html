<!doctype html>
<title>none</title>
<!-- IndexedDB: an upgrade makes a store with a key generator and two indexes; a transaction then sees a unique key
     refused (and the error prevented), reads by index, by key range and with a cursor going back, and completes -->
<script>
const out = [];
const r = indexedDB.open("db", 2);
r.onupgradeneeded = e => {
  out.push("up " + e.oldVersion + "-" + e.newVersion);
  const s = r.result.createObjectStore("people", { keyPath: "id", autoIncrement: true });
  s.createIndex("byName", "name");
  s.createIndex("byTag", "tags", { multiEntry: true });
  s.put({ name: "b", tags: ["x", "y"] });
  s.put({ name: "a", tags: ["y"] });
};
r.onsuccess = () => {
  const tx = r.result.transaction("people", "readwrite"), s = tx.objectStore("people");
  s.add({ id: 1, name: "dup" }).onerror = e => { out.push("dup " + e.target.error.name); e.preventDefault(); };
  s.index("byName").getAll().onsuccess = e => out.push("names " + e.target.result.map(x => x.name).join(","));
  s.index("byTag").count("y").onsuccess = e => out.push("y " + e.target.result);
  s.getAll(IDBKeyRange.lowerBound(2)).onsuccess = e => out.push("range " + e.target.result.map(x => x.id).join(","));
  const seen = [];
  s.openCursor(null, "prev").onsuccess = e => { const c = e.target.result; if (c) { seen.push(c.key); c.continue(); } else out.push("back " + seen.join(",")); };
  tx.oncomplete = () => { out.push("done"); document.title = out.join(" | "); };
};
</script>
