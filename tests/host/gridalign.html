<!doctype html><title>t</title>
<style>
body { margin: 0; }
.g { display: grid; width: 200px; height: 100px; grid-template-columns: [a] 50px [b] 50px [c]; grid-template-rows: 20px 20px; position: relative; }
.g > div { height: 10px; }
</style>
<div class=g id=g1 style="justify-content: center; align-content: end"><div id=i1></div><div></div><div></div><div></div></div>
<div class=g id=g2 style="justify-content: space-between; grid-template-columns: [a] auto [b] auto"><div id=i2 style="width: 30px"></div><div id=i3 style="width: 30px"></div></div>
<div class=g id=g3 style="direction: ltr"><div id=i4 style="width: 10px; justify-self: self-start; direction: rtl"></div></div>
<script>
// grid content distribution (justify-content, align-content), auto tracks not stretched under them, self-start by
// the item's own direction, and line names in the computed template
const o = id => { const e = document.getElementById(id); return e.offsetLeft + "," + e.offsetTop; };
document.title = [o("i1"), o("i2"), o("i3"), o("i4"), getComputedStyle(document.getElementById("g1")).gridTemplateColumns,
  getComputedStyle(document.getElementById("g2")).gridTemplateColumns].join(" | ");
</script>
