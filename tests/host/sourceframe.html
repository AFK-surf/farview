<!doctype html>
<title>frame</title>
<!-- answers on e.source, and says hello to its parent first -->
<script>
onmessage = e => { if (e.source === null) { parent.postMessage("re null source for " + e.data, "*"); return; } e.source.postMessage("re " + e.data + " " + (e.source === parent), "*"); };
parent.postMessage("hello", "*");
</script>
