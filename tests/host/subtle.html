<!doctype html><script>
// Web Crypto: an AES-GCM round trip, an ECDSA signature its public key verifies, PBKDF2 into an AES key, and
// random values that are not all the same
(async () => {
  const s = crypto.subtle, r = [];
  const k = await s.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await s.encrypt({ name: "AES-GCM", iv }, k, new TextEncoder().encode("hello"));
  r.push(new TextDecoder().decode(await s.decrypt({ name: "AES-GCM", iv }, k, ct)), ct.byteLength);
  const ec = await s.generateKey({ name: "ECDSA", namedCurve: "P-256" }, false, ["sign", "verify"]);
  const sig = await s.sign({ name: "ECDSA", hash: "SHA-256" }, ec.privateKey, new Uint8Array([1, 2]));
  r.push(sig.byteLength, await s.verify({ name: "ECDSA", hash: "SHA-256" }, ec.publicKey, sig, new Uint8Array([1, 2])));
  const pw = await s.importKey("raw", new TextEncoder().encode("pw"), "PBKDF2", false, ["deriveKey"]);
  const dk = await s.deriveKey({ name: "PBKDF2", salt: new Uint8Array(8), iterations: 1000, hash: "SHA-256" }, pw, { name: "AES-CBC", length: 128 }, true, ["encrypt"]);
  r.push(new Uint8Array(await s.exportKey("raw", dk)).slice(0, 2).join(","));
  const a = crypto.getRandomValues(new Uint32Array(8)); r.push(new Set(a).size > 1, ec.privateKey.extractable, k.algorithm.name);
  window.res = r.join(" "); window.__wpt = 1;
})().catch(e => { window.res = "ERR " + e.name + " " + e.message; window.__wpt = 1; });
</script>
