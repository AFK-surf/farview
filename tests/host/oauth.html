<!doctype html><html><head><meta charset="utf-8"><title>oauth</title></head><body>
<button id="go">Sign in</button>
<pre id="out">none</pre>
<script>
// an OAuth popup as sites open one: the window's handle kept, its message checked by origin and source, its close
// polled for; the popup's address set after it opened (about:blank first, as many sign-in libraries do)
window.__r = { got: [], closed: false, early: null };
let w = null;
const popup = location.search.slice(1);
window.addEventListener('message', e => {
  window.__r.got.push({ data: e.data, origin: e.origin, sourceIsPopup: e.source === w, sourceNull: e.source === null });
  document.getElementById('out').textContent = JSON.stringify(window.__r);
});
document.getElementById('go').addEventListener('click', () => {
  w = window.open('', 'oauth', 'width=500,height=600');
  window.__r.early = { type: typeof w, closed: w && w.closed, hasPost: w && typeof w.postMessage };
  w.location.href = popup;
  const poll = setInterval(() => { if (w.closed) { window.__r.closed = true; clearInterval(poll); } }, 50);
});
</script></body></html>
