<!doctype html><title>t</title>
<style>
@import url(layer-import.css) layer(imp);
@layer base, utilities;
@layer utilities { #a { color: rgb(0, 0, 3); } }
@layer base { #a { color: rgb(0, 0, 1); } #a#a { width: 10px; } }
#a { height: 5px; }
@layer base { #a { height: 9px !important; } }
#a { height: 7px !important; }
@layer base.inner { #b { color: rgb(0, 2, 0); } }
@layer base { #b { color: rgb(0, 1, 0); } }
@scope (.card) to (.slot) {
  p { margin-left: 3px; }
  :scope { margin-top: 4px; }
}
</style>
<div id=a></div><div id=b></div><div id=f></div>
<div class=card><p id=c></p><div class=slot><p id=d></p></div></div><p id=e></p>
<script>
// layer order decides before specificity; unlayered beats layered; !important reverses layers; a layer's own
// rules beat its sublayers; @import layer(); @scope with its root and limit
const g = (id, p) => getComputedStyle(document.getElementById(id))[p];
const card = document.querySelector(".card");
document.title = [g("a", "color"), g("a", "width"), g("a", "height"), g("b", "color"), g("f", "color"),
  g("c", "marginLeft"), g("d", "marginLeft"), g("e", "marginLeft"), getComputedStyle(card).marginTop].join(" | ");
</script>
