<!doctype html>
<title>none</title>
<!-- a canvas's drawings are drawn when its pixels are read, in the order asked: what a clear of the whole canvas
     undoes is gone, a clear of part keeps the rest, a canvas drawn into another is read as it was then -->
<canvas id=a width=20 height=10></canvas><canvas id=b width=20 height=10></canvas>
<script>
const a = document.getElementById("a").getContext("2d"), b = document.getElementById("b").getContext("2d");
const px = (c, x, y) => Array.from(c.getImageData(x, y, 1, 1).data).join(",");
const out = [];
a.fillStyle = "red"; a.fillRect(0, 0, 20, 10);
a.clearRect(0, 0, 20, 10);
a.fillStyle = "blue"; a.fillRect(0, 0, 5, 5);
out.push(px(a, 1, 1), px(a, 10, 8));
a.fillStyle = "lime"; a.fillRect(0, 0, 20, 10);
a.clearRect(0, 0, 10, 10);
out.push(px(a, 2, 2), px(a, 15, 5));
b.drawImage(document.getElementById("a"), 0, 0);
a.clearRect(0, 0, 20, 10);
out.push(px(b, 15, 5), px(a, 15, 5));
a.save(); a.beginPath(); a.rect(0, 0, 5, 5); a.clip(); a.fillStyle = "red"; a.fillRect(0, 0, 20, 10); a.clearRect(0, 0, 20, 10); a.restore();
a.fillStyle = "blue"; a.fillRect(10, 0, 5, 5);
out.push(px(a, 2, 2), px(a, 12, 2));
document.title = out.join(" | ");
</script>
