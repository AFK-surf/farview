<!doctype html>
<title>child</title>
<body style="margin:0;background:#fec;font:16px sans-serif">
<p id=p style="margin:8px">child of another origin</p>
<button id=b style="margin:8px">press</button>
<script>
let reach = "none";
try { reach = parent.document ? "parent document open" : "parent document hidden"; } catch (e) { reach = "parent document blocked"; }
window.addEventListener("message", e => { document.getElementById("p").textContent = "child got: " + e.data.say; });
document.getElementById("b").addEventListener("click", () => parent.postMessage({ say: "pressed" }, "*"));
parent.postMessage({ say: "ready", reach }, "*");
</script>
</body>
