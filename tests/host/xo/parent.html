<!doctype html>
<title>parent</title>
<body style="margin:0;font:16px sans-serif">
<p style="margin:10px">A frame of another origin:</p>
<iframe id=f style="width:300px;height:120px;border:2px solid #888"></iframe>
<script>
// the frame's address is the other origin of the test server pair (?child=URL)
const child = new URLSearchParams(location.search).get("child");
const f = document.getElementById("f");
const seen = [];
window.addEventListener("message", e => {
  seen.push(e.data && e.data.say + (e.data.reach ? " (" + e.data.reach + ")" : ""));
  document.title = seen.join(", ") + " | from " + e.origin + " | doc " + (f.contentDocument === null ? "hidden" : "open");
  if (e.data && e.data.say === "ready") e.source.postMessage({ say: "hello child" }, "*");
});
f.src = child;
</script>
</body>
