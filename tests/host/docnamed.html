<!doctype html>
<title>none</title>
<!-- a document's named properties: a form by its name (as sign-in pages post with document.fmHF.submit()), a frame by
     its name as its window, two of a name as a list, and what Document has (title) ahead of an element named so -->
<body onload="go()">
<form name="fmHF" action="about:blank"><input name="t" value="v"></form>
<iframe name="side" srcdoc="hi"></iframe>
<img name="pic"><img name="pic">
<form name="title"></form>
<script>
function go() {
  const out = [];
  out.push(document.fmHF instanceof HTMLFormElement ? "form " + document.fmHF.t.value : "form " + document.fmHF);
  out.push("frame " + (document.side === window.frames[0]));
  out.push("pics " + document.pic.length);
  out.push("own " + (typeof document.title));
  out.push("none " + document.nothingHere);
  document.title = out.join(" | ");
}
</script>
