<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Farview Stage 12A — Media Player</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 24px;
    background: #0f172a;
    color: #e2e8f0;
    font-family: Arial, sans-serif;
  }
  h1 {
    margin: 0 0 14px 0;
    font-size: 18px;
    font-weight: 600;
    color: #f8fafc;
  }
  .layout {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }
  .media-col {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 420px;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 12px;
  }
  .card-label {
    font-size: 12px;
    color: #94a3b8;
    margin-bottom: 8px;
    font-weight: 600;
  }
  video {
    display: block;
    width: 394px;
    height: 222px;
    border-radius: 6px;
    background: #020617;
  }
  audio {
    display: block;
    width: 394px;
    height: 44px;
  }
  .panel {
    flex: 1;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 14px;
    font-size: 13px;
    line-height: 1.55;
  }
  .row {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #293548;
    padding: 4px 0;
  }
  .row:last-child { border-bottom: none; }
  .k { color: #94a3b8; }
  .v { color: #38bdf8; font-weight: 600; }
  .events {
    margin-top: 10px;
    padding: 8px;
    background: #0f172a;
    border-radius: 6px;
    font-size: 12px;
    color: #a7f3d0;
    min-height: 44px;
    word-break: break-word;
  }
</style>
</head>
<body>
  <h1>Farview Stage 12A — Native &lt;video&gt; &amp; &lt;audio&gt;</h1>
  <div class="layout">
    <div class="media-col">
      <div class="card">
        <div class="card-label">HTMLVideoElement (controls + poster + MP4)</div>
        <video id="v" controls poster="/test_poster.png" src="/test_video.mp4" width="394" height="222"></video>
      </div>
      <div class="card">
        <div class="card-label">HTMLAudioElement (controls + WAV)</div>
        <audio id="a" controls src="/test_audio.wav"></audio>
      </div>
    </div>
    <div class="panel">
      <div class="card-label">Media Telemetry</div>
      <div class="row"><span class="k">canPlayType(mp4)</span><span class="v" id="s-cpt-mp4">-</span></div>
      <div class="row"><span class="k">canPlayType(wav)</span><span class="v" id="s-cpt-wav">-</span></div>
      <div class="row"><span class="k">videoSize</span><span class="v" id="s-size">0 x 0</span></div>
      <div class="row"><span class="k">duration</span><span class="v" id="s-dur">NaN</span></div>
      <div class="row"><span class="k">currentTime</span><span class="v" id="s-ct">0.00s</span></div>
      <div class="row"><span class="k">readyState</span><span class="v" id="s-rs">0</span></div>
      <div class="row"><span class="k">paused / ended</span><span class="v" id="s-pe">true / false</span></div>
      <div class="row"><span class="k">audio duration</span><span class="v" id="s-adur">NaN</span></div>
      <div class="events" id="s-ev">events: (none)</div>
    </div>
  </div>
<script>
  const v = document.getElementById('v');
  const a = document.getElementById('a');
  const evLog = [];
  function upd() {
    document.getElementById('s-cpt-mp4').textContent = JSON.stringify(v.canPlayType('video/mp4'));
    document.getElementById('s-cpt-wav').textContent = JSON.stringify(a.canPlayType('audio/wav'));
    document.getElementById('s-size').textContent = v.videoWidth + ' x ' + v.videoHeight;
    document.getElementById('s-dur').textContent = isFinite(v.duration) ? v.duration.toFixed(2) + 's' : 'NaN';
    document.getElementById('s-ct').textContent = (v.currentTime || 0).toFixed(2) + 's';
    document.getElementById('s-rs').textContent = String(v.readyState);
    document.getElementById('s-pe').textContent = v.paused + ' / ' + v.ended;
    document.getElementById('s-adur').textContent = isFinite(a.duration) ? a.duration.toFixed(2) + 's' : 'NaN';
    document.getElementById('s-ev').textContent = 'events: ' + (evLog.length ? evLog.slice(-10).join(', ') : '(none)');
  }
  for (const name of ['loadstart', 'loadedmetadata', 'loadeddata', 'canplay', 'canplaythrough', 'play', 'timeupdate', 'pause', 'ended']) {
    v.addEventListener(name, () => { evLog.push(name); upd(); });
  }
  for (const name of ['loadedmetadata', 'canplay', 'play', 'pause', 'ended']) {
    a.addEventListener(name, upd);
  }
  window.__stage12Events = evLog;
  upd();
</script>
</body>
</html>
