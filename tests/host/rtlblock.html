<!doctype html><title>t</title>
<style>body { margin: 0; } #c { direction: rtl; width: 300px; position: relative; } #c > div { height: 10px; }</style>
<div id=c><div id=a style="width: 100px; margin-right: 20px"></div><div id=b style="width: 400px"></div><div id=s style="width: 50px; height: 50px; position: relative"><span id=p style="position: absolute; width: 10px; height: 10px"></span></div></div>
<script>
// in a right-to-left block a narrower box sits against the right (the left margin gives way), a wider one overflows
// to the left, and an absolutely positioned box with neither left nor right starts at the right
const o = id => document.getElementById(id).offsetLeft;
document.title = [o("a"), o("b"), o("p")].join(" | ");
</script>
