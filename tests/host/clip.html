<!doctype html><p id=p>copy me</p><script>
// the clipboard: writeText then readText, and a copy command copies the selection (its copy event first)
(async () => {
  const r = [];
  await navigator.clipboard.writeText("one"); r.push(await navigator.clipboard.readText());
  let ev = ""; document.addEventListener("copy", e => { ev = e.type + ":" + (e.clipboardData instanceof DataTransfer); });
  const range = document.createRange(); range.selectNodeContents(document.getElementById("p")); getSelection().removeAllRanges(); getSelection().addRange(range);
  r.push(document.execCommand("copy"), ev, await navigator.clipboard.readText());
  window.res = r.join(" | "); window.__wpt = 1;
})().catch(e => { window.res = "ERR " + e; window.__wpt = 1; });
</script>
