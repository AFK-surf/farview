<!doctype html>
<title>validate</title>
<form id=f><input id=a name=a required><input id=e name=e type=email value="not-an-email"><button id=b>go</button></form>
<script>
// constraint validation: what a form's controls break, invalid fired, and a person's submit held back until fixed
const res = [];
const f = document.getElementById("f"), a = document.getElementById("a"), e = document.getElementById("e");
let invalid = 0, submitted = 0;
a.addEventListener("invalid", () => invalid++); e.addEventListener("invalid", () => invalid++);
f.addEventListener("submit", ev => { ev.preventDefault(); submitted++; });
res.push(a.validity.valueMissing, e.validity.typeMismatch, f.checkValidity(), invalid);
document.getElementById("b").click();
res.push(submitted);
a.value = "x"; e.value = "a@b.co";
document.getElementById("b").click();
res.push(submitted, f.checkValidity());
</script>
