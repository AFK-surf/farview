<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>gradients</title>
<style>
body { margin: 0; font: 12px sans-serif; }
div { width: 180px; height: 80px; margin: 8px; display: inline-block; }
#a { background: linear-gradient(to right, rgb(255,0,0), rgb(0,0,255)); }
#b { background: linear-gradient(45deg, #ff0 0%, #0f0 50%, #00f 100%); }
#c { background-image: linear-gradient(to bottom right, black, white); }
#d { --tw-gradient-position: to right in oklab; --tw-gradient-stops: var(--tw-gradient-position), #3b82f6 0%, #ec4899 100%; background-image: linear-gradient(var(--tw-gradient-stops)); }
#e { background: radial-gradient(circle, white 0, black 40px); }
#f { background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red); border-radius: 40px; }
#g { background: repeating-linear-gradient(90deg, #000 0 10px, #fff 10px 20px); }
#h { background: linear-gradient(rgba(0,0,0,.5), rgba(0,0,0,.5)), linear-gradient(to right, red, red 50%, lime 50%); }
#i { background: radial-gradient(ellipse at top left, #f00, transparent 70%), #00f; }
</style>
<div id=a></div><div id=b></div><div id=c></div><div id=d></div><div id=e></div><div id=f></div><div id=g></div><div id=h></div><div id=i></div>
