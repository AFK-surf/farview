<!doctype html>
<title>srcset</title>
<!-- which picture an img shows of those its srcset, sizes and picture's sources offer (800 px wide, 1x) -->
<img id="a" src="a.png" srcset="b.png 1x, c.png 2x">
<img id="b" srcset="s.png 200w, m.png 800w, l.png 1600w" sizes="(max-width: 500px) 100vw, 400px">
<picture><source media="(max-width: 500px)" srcset="phone.png"><source type="image/x-foo" srcset="foo.png"><img id="c" src="desk.png"></picture>
