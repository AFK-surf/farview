<!doctype html>
<title>slider</title>
<body style="margin:0;font:16px sans-serif">
<p style="margin:20px">Drag the knob to the end</p>
<div id=track style="position:relative;margin:20px;width:300px;height:40px;background:#eee;border-radius:20px">
  <div id=knob style="position:absolute;left:0;top:0;width:40px;height:40px;background:#1d9bf0;border-radius:20px"></div>
</div>
<script>
// a slider captcha's way: the knob follows the finger from where it went down; dragged to the end, it is done
const knob = document.getElementById("knob");
let from = null;
knob.addEventListener("touchstart", e => { from = e.touches[0].clientX; e.preventDefault(); });
document.addEventListener("touchmove", e => { if (from === null) return; const dx = Math.max(0, Math.min(260, e.touches[0].clientX - from)); knob.style.left = dx + "px"; });
document.addEventListener("touchend", e => { if (from === null) return; from = null; document.title = parseFloat(knob.style.left) >= 255 ? "slider done" : "slider short " + knob.style.left; });
</script>
</body>
