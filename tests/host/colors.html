<!doctype html><title>t</title>
<div style="color: blue"><span id=a>x</span><span id=i style="color: initial">y</span></div>
<script>
// CSS Color 4 and 5 forms, read back as their computed values
const a = document.getElementById("a"), res = [];
for (const v of ["color-mix(in srgb, red 50%, blue)", "lab(50 20 30)", "hsl(0, 100%, 75%)", "oklch(0.7 0.1 200 / 50%)",
  "rgb(from red r g calc(b + 255))", "color(display-p3 1 0 0)"]) {
  a.style.color = v;
  res.push(getComputedStyle(a).color);
}
res.push(getComputedStyle(document.getElementById("i")).color);
document.title = res.join(" | ");
</script>
