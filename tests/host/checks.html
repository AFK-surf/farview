<!doctype html>
<title>checks</title>
<body style="margin:0;font:16px sans-serif">
<label id=l><input type=checkbox id=cb name=agree> I agree</label>
<p><label><input type=radio name=size value=s id=rs checked> small</label> <label><input type=radio name=size value=l id=rl> large</label></p>
<script>
// what a person's taps did, as the page saw it
const say = () => { document.title = "cb " + document.getElementById("cb").checked + " size " + document.querySelector("input[name=size]:checked").value; };
document.addEventListener("change", say);
</script>
</body>
