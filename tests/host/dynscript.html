<!doctype html>
<title>dyn</title>
<script>
  var s = document.createElement("script");
  s.textContent = "window.inlineRan = 1;";
  document.head.appendChild(s);
  var t = document.createElement("script");
  t.src = "dynscript.js";
  t.onload = function () { window.srcLoaded = 1; };
  document.head.appendChild(t);
  window.orderBefore = window.srcRan || 0;
</script>
