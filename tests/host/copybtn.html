<!doctype html>
<meta name="viewport" content="width=device-width">
<title>copy</title>
<button id="b" style="display:block;width:100%;height:500px;font-size:40px">Copy</button>
<p id="s">not yet</p>
<script>
document.getElementById("b").onclick = () => navigator.clipboard.writeText("farview-clip-42").then(() => { document.getElementById("s").textContent = "copied"; });
</script>
