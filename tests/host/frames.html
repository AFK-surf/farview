<!doctype html>
<title>frames</title>
<body style="margin:0;font:16px sans-serif">
<p style="margin:10px">Three frames:</p>
<iframe id=a srcdoc="<body style='margin:0;background:#cfe'><p style='margin:8px'>srcdoc frame</p><button id=b onclick='parent.document.title=&quot;clicked in frame&quot;'>press</button></body>" style="width:300px;height:80px;border:2px solid #888"></iframe>
<iframe id=s src="b.html" style="width:300px;height:80px;border:2px solid #888"></iframe>
<iframe id=e style="width:300px;height:60px;border:2px solid #888"></iframe>
<script>
// a frame a script fills itself, as editors and widgets do
const d = document.getElementById("e").contentDocument;
d.body.innerHTML = "<p style='margin:8px;color:#a00'>written by the page's script</p>";
</script>
</body>
