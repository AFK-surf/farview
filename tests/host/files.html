<!doctype html><html><head><meta charset="utf-8"><title>files</title></head><body>
<form id="f" method="post" enctype="multipart/form-data" action="/echo">
<input type="file" id="up" name="att" multiple>
<button id="send" type="submit">send</button>
</form>
<pre id="out">none</pre>
<input type="file" id="hid" accept="image/*,.txt" multiple style="display:none">
<button id="pick" type="button">Choose files</button>
<pre id="hidout">none</pre>
<a id="d1" download="hello.txt" href="data:text/plain;charset=utf-8,Hello%20from%20a%20data%20link%20%E4%BD%A0%E5%A5%BD">data link</a>
<a id="d2" href="#" onclick="return false">blob link</a>
<a id="d3" href="/report">attachment link</a>
<a id="d4" download href="/plain.csv">download attr to server</a>
<script>
const up = document.getElementById('up'), out = document.getElementById('out');
let events = [];
up.addEventListener('input', () => events.push('input'));
up.addEventListener('change', async () => {
  events.push('change');
  const parts = [];
  for (const f of up.files) {
    const buf = new Uint8Array(await f.arrayBuffer());
    let sum = 0; for (const b of buf) sum = (sum + b) % 65536;
    parts.push(f.name + '|' + f.type + '|' + f.size + '|' + sum + '|' + (await f.slice(0, 12).text()));
  }
  const fd = new FormData(document.getElementById('f'));
  parts.push('formdata:' + fd.getAll('att').map(x => x.name + ':' + x.size).join(','));
  out.textContent = events.join(',') + '\n' + parts.join('\n');
});
document.getElementById('d2').addEventListener('click', () => {
  const blob = new Blob(['col1,col2\n1,2\n'], { type: 'text/csv' });
  const u = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = u; a.download = 'made-by-script.csv';
  document.body.append(a); a.click(); a.remove(); URL.revokeObjectURL(u);
});
// a hidden file input a button clicks (as most sites have it): the picker the person's device shows, its files read
// as chosen ones, its cancel when it shut with nothing chosen
const hid = document.getElementById('hid'), hidout = document.getElementById('hidout');
let hidEvents = [];
document.getElementById('pick').addEventListener('click', () => hid.click());
hid.addEventListener('cancel', () => { hidEvents.push('cancel'); hidout.textContent = hidEvents.join(','); });
hid.addEventListener('change', async () => {
  hidEvents.push('change');
  const parts = [];
  for (const f of hid.files) parts.push(f.name + '|' + f.type + '|' + f.size + '|' + (await f.text()));
  hidout.textContent = hidEvents.join(',') + '\n' + parts.join('\n');
});
</script></body></html>
