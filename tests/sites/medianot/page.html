<!doctype html><html><head><meta name="viewport" content="width=device-width"><style>
body { margin: 0 }
div { height: 10px; width: 10px; background: #888 }
@media not all and (width >= 512px) { .a { width: 100px } }
@media not all and (min-width: 2000px) { .b { width: 110px } }
@media not print { .c { width: 120px } }
@media not screen and (max-width: 100px) { .d { width: 130px } }
@media not (min-width: 100px) { .e { width: 140px } }
@media (width < 40rem) { .f { width: 150px } }
</style></head><body><div class="a"></div><div class="b"></div><div class="c"></div><div class="d"></div><div class="e"></div><div class="f"></div>
</body></html>
