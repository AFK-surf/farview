<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { margin: 16px; font-family: sans-serif; font-size: 15px; line-height: 1.45; }
  pre { font-family: monospace; font-size: 13px; line-height: 125%; background: #f8f8f8; padding: 10px; border: 1px solid #e0e0e0; }
  .k { color: rgb(0, 128, 0); font-weight: bold; }
  .n { color: rgb(0, 0, 128); }
  .s { color: rgb(160, 0, 0); }
  .c { color: rgb(61, 123, 123); font-style: italic; }
</style>
</head>
<body>
<pre><span class="c"># Synthetic keyword highlighting layout test</span>
<span class="k">def</span> <span class="n">compute</span>(items):
    <span class="k">for</span> x <span class="k">in</span> items:
        <span class="k">if</span> x &gt; 0:
            <span class="k">yield</span> <span class="s">"ok"</span></pre>
</body>
</html>
