# Weekly upstream security & dependency audit (tools/check-upstream-security.sh).
# Farview pins V8 (via libnode), curl-impersonate (BoringSSL), pion and invar instead of forking Chromium/V8;
# this job reports when a pinned security-critical component falls behind an upstream (security) release and
# re-checks the banned unsafe source patterns. It runs on a schedule / by hand only, so an upstream release never
# breaks normal pull-request CI. Run with strict=true to make outdated security releases fail the job.
name: security-audit
on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      strict:
        description: "Fail the job when a pinned component is behind an upstream security release"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Upstream security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout farview
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Self-test (synthetic violations must be caught)
        run: bash tools/check-upstream-security.sh --self-test

      - name: Static audit + upstream release currency
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STRICT: ${{ inputs.strict && '--strict' || '' }}
        run: bash tools/check-upstream-security.sh --upstream $STRICT
