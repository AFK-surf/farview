# Windows x64 (MSVC ABI) build, test, and packaging workflow for Farview.
# Automatically runs only when native shims, link manifests, Windows scripts, or app shell change;
# always runnable on demand via workflow_dispatch.
name: pion-win
on:
  push:
    branches: [main]
    paths:
      - 'assets/icon.png'
      - 'native/**'
      - '**/pion.toml'
      - 'tools/deps.env'
      - 'tools/deps_pion_win.ps1'
      - 'tools/make_win_icon.ps1'
      - 'tools/package_pion_win.ps1'
      - 'tools/package_win_app.ps1'
      - 'tools/win_launcher.c'
      - 'tools/install_win.ps1'
      - 'pion/cmd/app/**'
      - '.github/workflows/pion-win.yml'
  pull_request:
    branches: [main]
    paths:
      - 'assets/icon.png'
      - 'native/**'
      - '**/pion.toml'
      - 'tools/deps.env'
      - 'tools/deps_pion_win.ps1'
      - 'tools/make_win_icon.ps1'
      - 'tools/package_pion_win.ps1'
      - 'tools/package_win_app.ps1'
      - 'tools/win_launcher.c'
      - 'tools/install_win.ps1'
      - 'pion/cmd/app/**'
      - '.github/workflows/pion-win.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PION_REV: 9ecbda462c5790e23c02d6d5a7bec7160c13f519

jobs:
  windows-x64:
    name: Pion (windows-x64 MSVC)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Configure Git LF line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout farview
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout pinned AFK-surf/pion
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AFK-surf/pion
          ref: 9ecbda462c5790e23c02d6d5a7bec7160c13f519
          path: .pion
          persist-credentials: false

      - name: Cache bootstrapped pion toolchain (Windows)
        id: pion-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .pion/out/pionc_win_s3.exe
            .pion/out/qbe.exe
          key: pion-windows-x64-${{ env.PION_REV }}

      - name: Setup MSYS2 for pion bootstrap
        if: steps.pion-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            gzip
            diffutils

      - name: Bootstrap pinned pionc.exe (Windows amd64_win)
        if: steps.pion-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          set -eu
          OUT_DIR="$PWD/.pion/out"
          RT_DIR="$PWD/.pion/runtime"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          mkdir -p "$OUT_DIR"
          CC=gcc sh .pion/scripts/build-qbe.sh "$OUT_DIR/qbe.exe"
          gcc -std=c11 -O2 -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-ident \
            -Wall -Wextra -Werror -c "$RT_DIR/pion_rt.c" -o "$OUT_DIR/pion_rt.o"
          gcc -std=c11 -O2 -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-ident \
            -Wall -Wextra -Werror -c "$RT_DIR/pion_cli.c" -o "$OUT_DIR/pion_cli.o"
          ar rcs "$OUT_DIR/libpionrt_cli.a" "$OUT_DIR/pion_rt.o" "$OUT_DIR/pion_cli.o"
          gzip -dc .pion/bootstrap/pionc-seed.ssa.gz > "$TMP_DIR/seed.ssa"
          "$OUT_DIR/qbe.exe" -t amd64_win -o "$TMP_DIR/pionc0.s" "$TMP_DIR/seed.ssa"
          gcc -Wa,-mbig-obj -c "$TMP_DIR/pionc0.s" -o "$TMP_DIR/pionc0.o"
          gcc "$TMP_DIR/pionc0.o" "$OUT_DIR/libpionrt_cli.a" -lm -lws2_32 -Wl,--stack,16777216 -o "$TMP_DIR/pionc0.exe"
          (cd .pion && PION_QBE="$OUT_DIR/qbe.exe" PION_TARGET=amd64_win PION_CACHE_DIR="$TMP_DIR/cas" \
            "$TMP_DIR/pionc0.exe" build --emit-ssa "$TMP_DIR/s3.ssa" --emit-obj "$TMP_DIR/s3.o" compiler/src/core compiler/src/cli/main.pion)
          test -s "$TMP_DIR/s3.o"
          gcc "$TMP_DIR/s3.o" "$OUT_DIR/libpionrt_cli.a" -lm -lws2_32 -Wl,--stack,16777216 -o "$OUT_DIR/pionc_win_s3.exe"
          "$OUT_DIR/pionc_win_s3.exe" --version

      - name: Cache pinned Windows deps
        id: win-deps-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: deps
          key: win-deps-v1-${{ hashFiles('tools/deps.env', 'tools/deps_pion_win.ps1', 'tools/icon_map.txt', 'tools/icon_pack_empty/**') }}

      - name: Fetch pinned Windows deps (invar, WebView2, curl-impersonate, libnode)
        if: steps.win-deps-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "C:\Program Files\LLVM\bin;$env:PATH"
          & "$PWD/tools/deps_pion_win.ps1"

      - name: Compute Windows CAS environment fingerprint
        id: win-env
        shell: pwsh
        run: |
          $ccv = (& 'C:\Program Files\LLVM\bin\clang.exe' --version | Select-Object -First 1) -replace '[^A-Za-z0-9._]+', '-'
          if ($ccv.Length -gt 36) { $ccv = $ccv.Substring(0, 36) }
          "env_fp=$($env:ImageOS)-$ccv" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Cache pionc CAS (Windows incremental objects & packages)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/pion-cas
          key: pion-cas-v5-windows-x64-${{ steps.win-env.outputs.env_fp }}-${{ env.PION_REV }}-${{ hashFiles('tools/deps.env', 'native/**', 'pion/**/*.c', 'pion/**/*.cc', 'pion/**/*.h', 'pion/**/*.hpp', '**/c_compat/**') }}-${{ hashFiles('**/pion.toml', 'pion/**/*.pion') }}
          restore-keys: |
            pion-cas-v5-windows-x64-${{ steps.win-env.outputs.env_fp }}-${{ env.PION_REV }}-${{ hashFiles('tools/deps.env', 'native/**', 'pion/**/*.c', 'pion/**/*.cc', 'pion/**/*.h', 'pion/**/*.hpp', '**/c_compat/**') }}-
            pion-cas-v5-windows-x64-${{ steps.win-env.outputs.env_fp }}-${{ env.PION_REV }}-

      - name: Prepare Windows parallel verification scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          $ErrorActionPreference = 'Stop'
          $env:FV_PREBUILT_DIR = 'out'
          & "$PWD/tools/package_pion_win.ps1" -CompressionLevel Fastest
          $smoke = Join-Path $env:RUNNER_TEMP 'fv-smoke'
          if (Test-Path $smoke) { Remove-Item -Recurse -Force $smoke }
          Expand-Archive -Path 'dist\farview-pion-windows-x64.zip' -DestinationPath $smoke -Force
          $pkg = Join-Path $smoke 'farview-pion-windows-x64'
          $tabUrl = 'file:///' + ((Resolve-Path tests\host\tab.html).Path -replace '\\','/')
          $proc = Start-Process -FilePath (Join-Path $pkg 'bin\host.exe') -ArgumentList @('--tab', '27590', $tabUrl) -WorkingDirectory $smoke -PassThru -NoNewWindow
          try {
            for ($i = 0; $i -lt 50; $i++) {
              try { $tc = New-Object System.Net.Sockets.TcpClient; $tc.Connect('127.0.0.1', 27591); $tc.Close(); break } catch { Start-Sleep -Milliseconds 200 }
            }
            $res = & (Join-Path $pkg 'bin\agent.exe') 127.0.0.1 27591 'eval:1+41' 'eval:document.title'
            $res | ForEach-Object { Write-Host $_ }
            if (-not ($res -contains '42')) { throw 'Expected 42 from packaged host+agent' }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
          '@ | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'win-pkg-cli-smoke.ps1')

          @'
          $ErrorActionPreference = 'Stop'
          $env:FV_PREBUILT_DIR = 'out'
          & "$PWD/tools/package_win_app.ps1" -Version '0.1.0' -PrebuiltDir 'out' -CompressionLevel Fastest
          if (-not (Test-Path 'dist\Farview-0.1.0-windows-x64.zip')) { throw 'Missing desktop Windows zip' }
          $appSmoke = Join-Path $env:RUNNER_TEMP 'fv-app-smoke'
          if (Test-Path $appSmoke) { Remove-Item -Recurse -Force $appSmoke }
          Expand-Archive -Path 'dist\Farview-0.1.0-windows-x64.zip' -DestinationPath $appSmoke -Force
          if (-not (Test-Path (Join-Path $appSmoke 'Farview-0.1.0-windows-x64\Farview.exe'))) { throw 'Missing Farview.exe in desktop zip' }
          if (-not (Test-Path (Join-Path $appSmoke 'Farview-0.1.0-windows-x64\pion-app.exe'))) { throw 'Missing pion-app.exe in desktop zip' }
          '@ | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'win-pkg-app-smoke.ps1')

          @'
          import pathlib, re
          txt = pathlib.Path("html5lib.out").read_text(encoding="utf-8")
          assert "read failed:" not in txt, "html5lib encountered read_errors"
          m = re.search(r"(?m)^pass\s+(\d+)\s+fail\s+(\d+)\s*$", txt)
          assert m, "Missing html5lib summary line"
          p, f = int(m.group(1)), int(m.group(2))
          actual = sorted(l[9:].strip() for l in txt.splitlines() if l.startswith("FAIL_KEY "))
          assert len(actual) == f, f"FAIL_KEY count mismatch: {len(actual)} vs {f}"
          baseline = sorted(
              l.strip()
              for l in pathlib.Path("tests/html5lib/known-failures.txt").read_text(encoding="utf-8").splitlines()
              if l.strip() and not l.strip().startswith("#")
          )
          unexpected = sorted(set(actual) - set(baseline))
          print(f"html5lib: pass={p}, fail={f}, baseline={len(baseline)}, unexpected={len(unexpected)}")
          assert p >= 3533 and not unexpected, f"unexpected={unexpected[:10]}"
          '@ | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'win-html5lib-check.py')

          @'
          $ErrorActionPreference = 'Stop'
          $env:FV_APP_SELFTEST_MT = '1'
          $st = Start-Process -FilePath .\out\pion-app.exe -Wait -PassThru -NoNewWindow
          if ($st.ExitCode -ne 0) { throw "pion-app selftest failed (exit $($st.ExitCode))" }
          Remove-Item Env:FV_APP_SELFTEST_MT -ErrorAction SilentlyContinue
          $dats = (Get-ChildItem tests\html5lib\tree-construction\*.dat | Sort-Object Name | ForEach-Object { 'tests/html5lib/tree-construction/' + $_.Name })
          $out = & .\out\pion-html5lib.exe --list-failures @dats
          if ($LASTEXITCODE -ne 0) { throw "pion-html5lib failed (exit $LASTEXITCODE)" }
          $out | Set-Content -Encoding utf8 html5lib.out
          & python (Join-Path $env:RUNNER_TEMP 'win-html5lib-check.py')
          if ($LASTEXITCODE -ne 0) { throw "html5lib baseline check failed (exit $LASTEXITCODE)" }
          '@ | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'win-html5lib.ps1')

          @'
          $ErrorActionPreference = 'Stop'
          function Run-BuildWave([string[]]$targets, [int]$jobsPerProc, [int]$maxConc) {
            $active = @()
            $failed = @()
            foreach ($t in $targets) {
              while ($active.Count -ge $maxConc) {
                $still = @()
                foreach ($item in $active) {
                  if ($item.Proc.HasExited) {
                    $item.Proc.WaitForExit()
                    if ($item.Proc.ExitCode -ne 0) {
                      $failed += $item.Target
                      Write-Host "=== FAILED pion-$($item.Target).exe (exit $($item.Proc.ExitCode)) ==="
                      if (Test-Path $item.Out) { Get-Content $item.Out }
                      if (Test-Path $item.Err) { Get-Content $item.Err }
                    }
                  } else {
                    $still += $item
                  }
                }
                $active = $still
                if ($active.Count -ge $maxConc) { Start-Sleep -Milliseconds 50 }
              }
              $outLog = Join-Path $env:RUNNER_TEMP "win-bld-$t.out.log"
              $errLog = Join-Path $env:RUNNER_TEMP "win-bld-$t.err.log"
              Write-Host "=== Building pion-$t.exe (jobs=$jobsPerProc) ==="
              $p = Start-Process -FilePath $env:PIONC -ArgumentList @('build', '--jobs', "$jobsPerProc", '-o', "out/pion-$t.exe", "pion/cmd/$t") -PassThru -NoNewWindow -RedirectStandardOutput $outLog -RedirectStandardError $errLog
              $active += [pscustomobject]@{ Target = $t; Proc = $p; Out = $outLog; Err = $errLog }
            }
            foreach ($item in $active) {
              $item.Proc.WaitForExit()
              if ($item.Proc.ExitCode -ne 0) {
                $failed += $item.Target
                Write-Host "=== FAILED pion-$($item.Target).exe (exit $($item.Proc.ExitCode)) ==="
                if (Test-Path $item.Out) { Get-Content $item.Out }
                if (Test-Path $item.Err) { Get-Content $item.Err }
              }
            }
            if ($failed.Count -gt 0) {
              throw "Windows build failed for: $($failed -join ', ')"
            }
          }
          $t0 = Get-Date
          # Wave 1: build the two heavy targets (host + app) in parallel to warm shared + disjoint CAS entries
          Run-BuildWave @('host', 'app') 2 2
          # Wave 2: build the 8 lightweight commands in parallel (4 workers, reusing CAS from Wave 1)
          Run-BuildWave @('jsprobe', 'wpt', 'agent', 'layout', 'html5lib', 'probe', 'unpack', 'docshot') 1 4
          $dt = [Math]::Round(((Get-Date) - $t0).TotalSeconds, 1)
          Write-Host "Windows parallel build elapsed: ${dt}s"
          '@ | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'win-build.ps1')

          @'
          $ErrorActionPreference = 'Stop'
          $cliOut = Join-Path $env:RUNNER_TEMP 'win-pkg-cli.out.log'
          $cliErr = Join-Path $env:RUNNER_TEMP 'win-pkg-cli.err.log'
          $appOut = Join-Path $env:RUNNER_TEMP 'win-pkg-app.out.log'
          $appErr = Join-Path $env:RUNNER_TEMP 'win-pkg-app.err.log'
          $htmlOut = Join-Path $env:RUNNER_TEMP 'win-html.out.log'
          $htmlErr = Join-Path $env:RUNNER_TEMP 'win-html.err.log'
          $p1 = Start-Process -FilePath pwsh -ArgumentList @('-NoProfile', '-File', (Join-Path $env:RUNNER_TEMP 'win-pkg-cli-smoke.ps1')) -PassThru -NoNewWindow -RedirectStandardOutput $cliOut -RedirectStandardError $cliErr
          $p2 = Start-Process -FilePath pwsh -ArgumentList @('-NoProfile', '-File', (Join-Path $env:RUNNER_TEMP 'win-pkg-app-smoke.ps1')) -PassThru -NoNewWindow -RedirectStandardOutput $appOut -RedirectStandardError $appErr
          $p3 = Start-Process -FilePath pwsh -ArgumentList @('-NoProfile', '-File', (Join-Path $env:RUNNER_TEMP 'win-html5lib.ps1')) -PassThru -NoNewWindow -RedirectStandardOutput $htmlOut -RedirectStandardError $htmlErr
          $tFail = 0
          & $env:PIONC test pion/cmd/host
          if ($LASTEXITCODE -ne 0) { $tFail = 1 }
          & $env:PIONC test pion/cmd/app
          if ($LASTEXITCODE -ne 0) { $tFail = 1 }
          $p1.WaitForExit()
          $p2.WaitForExit()
          $p3.WaitForExit()
          Write-Host '=== html5lib + app selftest ==='
          if (Test-Path $htmlOut) { Get-Content $htmlOut }
          if (Test-Path $htmlErr) { Get-Content $htmlErr }
          Write-Host '=== package CLI + ZIP smoke ==='
          if (Test-Path $cliOut) { Get-Content $cliOut }
          if (Test-Path $cliErr) { Get-Content $cliErr }
          Write-Host '=== package Desktop App + ZIP smoke ==='
          if (Test-Path $appOut) { Get-Content $appOut }
          if (Test-Path $appErr) { Get-Content $appErr }
          $cas = Join-Path $env:RUNNER_TEMP 'pion-cas'
          if (Test-Path $cas) {
            $tot = (Get-ChildItem -Recurse -File $cas | Measure-Object -Property Length -Sum).Sum
            Write-Host ('pion-cas total: {0:N1} MB' -f ($tot / 1MB))
            Get-ChildItem -Directory $cas | Sort-Object Name | ForEach-Object {
              $sub = (Get-ChildItem -Recurse -File $_.FullName | Measure-Object -Property Length -Sum).Sum
              Write-Host ('  {0}: {1:N1} MB' -f $_.Name, ($sub / 1MB))
            }
          }
          if ($tFail -ne 0 -or $p1.ExitCode -ne 0 -or $p2.ExitCode -ne 0 -or $p3.ExitCode -ne 0) {
            throw "Windows parallel verification failed: tests=$tFail cli_pkg=$($p1.ExitCode) app_pkg=$($p2.ExitCode) html5lib=$($p3.ExitCode)"
          }
          '@ | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'win-tail.ps1')

      - name: Build, test, html5lib, and package Windows x64
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          set "PATH=C:\Program Files\LLVM\bin;%CD%\deps\node\lib;%PATH%"
          set "CC=C:\Program Files\LLVM\bin\clang.exe"
          set "CXX=C:\Program Files\LLVM\bin\clang++.exe"
          set "PION_WIN_ABI=msvc"
          set "PIONC=%CD%\.pion\out\pionc_win_s3.exe"
          set "PION_QBE=%CD%\.pion\out\qbe.exe"
          set "PION_RT_LIB="
          set "CPATH=%CD%\.pion\runtime"
          set "PION_CACHE_DIR=%RUNNER_TEMP%\pion-cas"
          set "PION_CACHE_MAX_MB=1536"
          mkdir out 2>nul
          copy /Y deps\node\lib\libnode.dll out\libnode.dll >nul
          "%PIONC%" fmt --check --json pion/packages pion/cmd
          if errorlevel 1 exit /b 1
          pwsh -NoProfile -File "%RUNNER_TEMP%\win-build.ps1"
          if errorlevel 1 exit /b 1
          rem Overlap CLI+Desktop ZIP packaging/smoke and selftest+html5lib with cmd/host & cmd/app pionc tests
          rem (only the foreground lane writes to pion-cas; the three background lanes invoke zero pionc calls).
          pwsh -NoProfile -File "%RUNNER_TEMP%\win-tail.ps1"
          if errorlevel 1 exit /b 1

      - name: Upload Windows release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: farview-pion-windows-x64
          path: dist/farview-pion-windows-x64.zip
          retention-days: 7
