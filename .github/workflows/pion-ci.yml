# Pure-Pion CI for Farview
# Bootstraps pinned AFK-surf/pion (Stage 0 -> Stage 2 fixed-point), fetches pinned
# AFK-surf/invar + SHA-256-verified curl-impersonate + libnode, runs fmt/check/full unit tests
# (with --deps), html5lib conformance, hygiene/license gates, native binary builds, and
# self-contained release tarball packaging + isolated clean-environment smoke test.
name: pion-ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PION_REV: c770ff314cc52dba8297efba654e927057fd72ce
  MICROMAMBA_VER: 2.10.0-0

jobs:
  pion:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-15
            os: macos
            mamba_arch: osx-arm64
            mamba_sha256: c547639f5caf742236641c362746abb4a3505774753ecd08fe341643670c4c01
          - name: linux-x64
            runner: ubuntu-24.04
            os: linux
            mamba_arch: linux-64
            mamba_sha256: 701f39c06f8e6a670a0e186c8479b9e5c0502a2f0cda6cef65d83bdd2875e8bd
    name: Pion (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: Checkout farview
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout pinned AFK-surf/pion
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AFK-surf/pion
          ref: c770ff314cc52dba8297efba654e927057fd72ce
          path: .pion
          persist-credentials: false

      - name: Cache bootstrapped pion toolchain
        id: pion-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .pion/out/pionc2
            .pion/out/qbe
            .pion/out/libpionrt.a
          key: pion-${{ matrix.name }}-${{ env.PION_REV }}

      - name: Bootstrap pure-Pion toolchain (Stage 0 -> Stage 2 fixed-point)
        if: steps.pion-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          ACTUAL=$(git -C .pion rev-parse HEAD)
          if [ "$ACTUAL" != "$PION_REV" ]; then
            echo "pion revision mismatch: got $ACTUAL, expected $PION_REV" >&2
            exit 1
          fi
          OUT_DIR="$PWD/.pion/out"
          COMPILER_DIR="$PWD/.pion/compiler"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          mkdir -p "$OUT_DIR"
          export PION_QBE="$OUT_DIR/qbe"
          export PION_RT_LIB="$OUT_DIR/libpionrt.a"
          PION_RT_CLI_LIB="$OUT_DIR/libpionrt_cli.a"
          export CC=cc

          echo "=== [1/5] Build QBE + libpionrt.a + libpionrt_cli.a ==="
          sh .pion/scripts/build-qbe.sh "$PION_QBE"
          "$CC" -std=c11 -O2 -fPIC -fno-asynchronous-unwind-tables -Wall -Wextra -Werror \
            -c .pion/runtime/pion_rt.c -o "$OUT_DIR/pion_rt.o"
          "$CC" -std=c11 -O2 -fPIC -fno-asynchronous-unwind-tables -Wall -Wextra -Werror \
            -c .pion/runtime/pion_cli.c -o "$OUT_DIR/pion_cli.o"
          ar rcs "$PION_RT_LIB" "$OUT_DIR/pion_rt.o"
          ar rcs "$PION_RT_CLI_LIB" "$OUT_DIR/pion_rt.o" "$OUT_DIR/pion_cli.o"

          echo "=== [2/5] Stage 0: Seed -> pionc0 ==="
          gzip -dc .pion/bootstrap/pionc-seed.ssa.gz > "$TMP_DIR/pionc-seed.ssa"
          if [ "${{ matrix.os }}" = "macos" ]; then
            "$PION_QBE" -t arm64_apple -o "$TMP_DIR/pionc0.s" "$TMP_DIR/pionc-seed.ssa"
            "$CC" "$TMP_DIR/pionc0.s" "$PION_RT_CLI_LIB" -lm -lpthread -o "$OUT_DIR/pionc0"
          else
            "$PION_QBE" -t amd64_sysv --obj -o "$TMP_DIR/pionc0.o" "$TMP_DIR/pionc-seed.ssa"
            "$CC" "$TMP_DIR/pionc0.o" "$PION_RT_CLI_LIB" -lm -lpthread -o "$OUT_DIR/pionc0"
          fi

          echo "=== [3/5] Stage 1: pionc0 -> pionc1 ==="
          mkdir -p "$TMP_DIR/cas_s1"
          PION_RT_LIB="$PION_RT_CLI_LIB" PION_CACHE_DIR="$TMP_DIR/cas_s1" "$OUT_DIR/pionc0" build \
            --emit-ssa "$OUT_DIR/stage1.ssa" \
            --emit-asm "$OUT_DIR/stage1.s" \
            -o "$OUT_DIR/pionc1" \
            "$COMPILER_DIR/src/core" \
            "$COMPILER_DIR/src/cli/main.pion"

          echo "=== [4/5] Stage 2: pionc1 -> pionc2 ==="
          mkdir -p "$TMP_DIR/cas_s2"
          PION_RT_LIB="$PION_RT_CLI_LIB" PION_CACHE_DIR="$TMP_DIR/cas_s2" "$OUT_DIR/pionc1" build \
            --emit-ssa "$OUT_DIR/stage2.ssa" \
            --emit-asm "$OUT_DIR/stage2.s" \
            -o "$OUT_DIR/pionc2" \
            "$COMPILER_DIR/src/core" \
            "$COMPILER_DIR/src/cli/main.pion"

          echo "=== [5/5] Fixed-point proof ==="
          if cmp -s "$OUT_DIR/stage1.ssa" "$OUT_DIR/stage2.ssa"; then
            cmp "$OUT_DIR/stage1.s" "$OUT_DIR/stage2.s"
            echo "Fixed-point (Stage 1 == Stage 2): BIT-FOR-BIT IDENTICAL"
          else
            mkdir -p "$TMP_DIR/cas_s3"
            PION_RT_LIB="$PION_RT_CLI_LIB" PION_CACHE_DIR="$TMP_DIR/cas_s3" "$OUT_DIR/pionc2" build \
              --emit-ssa "$OUT_DIR/stage3.ssa" \
              --emit-asm "$OUT_DIR/stage3.s" \
              -o "$OUT_DIR/pionc3" \
              "$COMPILER_DIR/src/core" \
              "$COMPILER_DIR/src/cli/main.pion"
            cmp "$OUT_DIR/stage2.ssa" "$OUT_DIR/stage3.ssa"
            cmp "$OUT_DIR/stage2.s" "$OUT_DIR/stage3.s"
            echo "Fixed-point (Stage 2 == Stage 3): BIT-FOR-BIT IDENTICAL"
          fi

      - name: Configure pion toolchain env
        id: pion-env
        run: |
          mkdir -p /tmp/pion-bin
          cp .pion/out/pionc2 /tmp/pion-bin/pionc
          cp .pion/out/libpionrt.a /tmp/pion-bin/libpionrt.a
          cp .pion/out/qbe /tmp/pion-bin/qbe
          cp .pion/runtime/pion_rt.h /tmp/pion-bin/pion_rt.h
          chmod +x /tmp/pion-bin/pionc /tmp/pion-bin/qbe
          echo "PIONC=/tmp/pion-bin/pionc" >> "$GITHUB_ENV"
          echo "PION_QBE=/tmp/pion-bin/qbe" >> "$GITHUB_ENV"
          echo "PION_RT_LIB=/tmp/pion-bin/libpionrt.a" >> "$GITHUB_ENV"
          echo "CPATH=/tmp/pion-bin" >> "$GITHUB_ENV"
          echo "PION_CACHE_DIR=${{ runner.temp }}/pion-cas" >> "$GITHUB_ENV"
          find /tmp/pion-bin -type f -exec env TZ=UTC touch -t 202601010000 {} +
          CC_FP=$(cc --version 2>&1 | head -n 1 | tr -cs 'A-Za-z0-9._' '-' | cut -c1-36)
          echo "env_fp=${ImageOS:-os}-${CC_FP}" >> "$GITHUB_OUTPUT"

      - name: Prepare deps, system packages, and hygiene gates (parallel)
        run: |
          set -eu
          mkdir -p deps /tmp/setup-logs

          (
            set -eu
            mkdir -p /tmp/bin
            MM_URL="https://github.com/mamba-org/micromamba-releases/releases/download/${MICROMAMBA_VER}/micromamba-${{ matrix.mamba_arch }}"
            curl -fsSL "$MM_URL" -o /tmp/bin/micromamba
            if command -v sha256sum >/dev/null 2>&1; then
              echo "${{ matrix.mamba_sha256 }}  /tmp/bin/micromamba" | sha256sum -c -
            else
              echo "${{ matrix.mamba_sha256 }}  /tmp/bin/micromamba" | shasum -a 256 -c -
            fi
            chmod +x /tmp/bin/micromamba
            /tmp/bin/micromamba create -y -q -r /tmp/mamba -p /tmp/n24 -c conda-forge 'nodejs=24.*'
            mkdir -p deps/node/include deps/node/lib
            cp -R /tmp/n24/include/node deps/node/include/
            NODE_LIC=$(find /tmp/mamba/pkgs -path '*/nodejs-*/info/licenses/LICENSE' -type f 2>/dev/null | head -n 1 || true)
            if [ -z "$NODE_LIC" ] || [ ! -f "$NODE_LIC" ]; then
              echo "Node.js LICENSE not found in conda-forge nodejs package" >&2
              exit 1
            fi
            cp "$NODE_LIC" deps/node/LICENSE
            if [ "${{ matrix.os }}" = "linux" ]; then
              cp -P /tmp/n24/lib/*.so* deps/node/lib/
              ln -sf libnode.so.137 deps/node/lib/libnode.so
            else
              cp -P /tmp/n24/lib/*.dylib deps/node/lib/
              ln -sf libnode.137.dylib deps/node/lib/libnode.dylib
            fi
          ) > /tmp/setup-logs/libnode.log 2>&1 &
          PID_NODE=$!

          (
            set -eu
            sh tools/deps_pion.sh
          ) > /tmp/setup-logs/deps_pion.log 2>&1 &
          PID_DEPS=$!

          (
            set -eu
            python3 tools/gen_prelude.py
            git diff --exit-code pion/packages/page_js/prelude.pion pion/packages/page_js/editing.pion
            python3 pion/packages/cookie/scripts/gen_psl_index.py --check
            python3 - <<'PY'
          import pathlib, re, sys
          tomls = sorted(pathlib.Path("pion").rglob("pion.toml"))
          if len(tomls) != 76:
              sys.exit(f"Expected 76 pion.toml manifests, found {len(tomls)}")
          missing = []
          for p in tomls:
              txt = p.read_text(encoding="utf-8")
              m = re.search(r'(?m)^license\s*=\s*"([^"]+)"', txt)
              if not m or not m.group(1).strip():
                  missing.append(str(p))
          if missing:
              sys.exit(f"Missing license field in: {missing}")
          print(f"License manifest gate passed: {len(tomls)}/76 manifests have non-empty license")

          # Static gate 1: zero `.px` files anywhere under `pion/` (Pion-JSX must live in `.pion`)
          px_files = sorted(str(p) for p in pathlib.Path("pion").rglob("*.px"))
          if px_files:
              sys.exit(f"Forbidden .px files found under pion/: {px_files}")

          # Static gate 2: zero hand-rolled `Glass::liquid` in `pion/cmd/app/**` and `pion/packages/shell_ui/**`
          # (note: `pion/packages/stage/scene.pion` uses `Glass::frosted` and is outside this check)
          glass_hits = []
          for root in (pathlib.Path("pion/cmd/app"), pathlib.Path("pion/packages/shell_ui")):
              for p in sorted(root.rglob("*.pion")):
                  for lineno, line in enumerate(p.read_text(encoding="utf-8").splitlines(), 1):
                      if "Glass::liquid" in line:
                          glass_hits.append(f"{p}:{lineno}: {line.strip()}")
          if glass_hits:
              sys.exit("Hand-rolled Glass::liquid forbidden in app/shell_ui:\n" + "\n".join(glass_hits))

          # Static gate 3: every `<ui::Text ...>` and imperative `ui::text(` in `pion/packages/shell_ui/**`
          # must explicitly specify `color_by`
          text_hits = []
          for p in sorted(pathlib.Path("pion/packages/shell_ui").rglob("*.pion")):
              src = p.read_text(encoding="utf-8")
              for m in re.finditer(r"<ui::Text\b[^>]*>", src, re.S):
                  if "color_by" not in m.group(0):
                      lineno = src.count("\n", 0, m.start()) + 1
                      text_hits.append(f"{p}:{lineno}: <ui::Text> missing explicit color_by")
              for m in re.finditer(r"\bui::text\s*\([^)]*\)", src, re.S):
                  if "color_by" not in m.group(0):
                      lineno = src.count("\n", 0, m.start()) + 1
                      text_hits.append(f"{p}:{lineno}: ui::text(...) missing explicit color_by")
          if text_hits:
              sys.exit("Explicit color_by required on every ui::Text / ui::text in shell_ui:\n" + "\n".join(text_hits))

          # Static gate 4 (v2 ratchet — zero legacy *_view.pion files in pion/cmd/app,
          # monotonically non-increasing baselines, and ZERO Unicode pseudo-icons in app & shell_ui):
          legacy_views = sorted(str(p) for p in pathlib.Path("pion/cmd/app").glob("*_view.pion"))
          if legacy_views:
              sys.exit(f"Ratchet regression: forbidden legacy *_view.pion files remain in pion/cmd/app: {legacy_views}")
          main_lines = pathlib.Path("pion/cmd/app/main.pion").read_text(encoding="utf-8").splitlines()
          if len(main_lines) > 2650:
              sys.exit(f"Ratchet regression: pion/cmd/app/main.pion grew to {len(main_lines)} lines (baseline <= 2650)")
          open_decls = sum(
              1 for l in main_lines
              if re.search(r"\b[a-z0-9_]+_open\s*[:=]", l) and not l.strip().startswith("//")
          )
          if open_decls > 261:
              sys.exit(f"Ratchet regression: *_open decls in pion/cmd/app/main.pion grew to {open_decls} (baseline <= 261)")
          stage_nodes = 0
          for p in sorted(pathlib.Path("pion/cmd/app").glob("*.pion")):
              if p.name.endswith("_test.pion"):
                  continue
              for l in p.read_text(encoding="utf-8").splitlines():
                  s = l.strip()
                  if s.startswith("//"):
                      continue
                  stage_nodes += len(re.findall(r"\bstage::stage_node\s*\(", s))
          if stage_nodes != 2:
              sys.exit(f"Ratchet regression: production stage::stage_node calls in pion/cmd/app == {stage_nodes} (expected == 2)")
          glyph_re = re.compile(r'"([^"\n]{1,4})"')
          mac_mod_keys = {0x2318, 0x21E7, 0x2325, 0x2303}  # ⌘ ⇧ ⌥ ⌃
          def is_pseudo_icon_char(ch):
              cp = ord(ch)
              if cp in mac_mod_keys:
                  return False
              return (0x2190 <= cp <= 0x2BFF) or (0x1F300 <= cp <= 0x1FAFF) or cp in (0x00D7, 0x2026)
          glyph_hits = 0
          for p in sorted(pathlib.Path("pion/cmd/app").glob("*.pion")):
              if p.name.endswith("_test.pion"):
                  continue
              for l in p.read_text(encoding="utf-8").splitlines():
                  if l.strip().startswith("//"):
                      continue
                  for m in glyph_re.finditer(l):
                      s = m.group(1)
                      if any(is_pseudo_icon_char(ch) for ch in s):
                          glyph_hits += 1
          if glyph_hits > 0:
              sys.exit(f"Ratchet regression: Unicode glyph icons in pion/cmd/app grew to {glyph_hits} (baseline == 0)")
          shell_ui_glyph_hits = []
          for p in sorted(pathlib.Path("pion/packages/shell_ui").glob("*.pion")):
              if p.name.endswith("_test.pion"):
                  continue
              for lineno, l in enumerate(p.read_text(encoding="utf-8").splitlines(), 1):
                  if l.strip().startswith("//"):
                      continue
                  for m in glyph_re.finditer(l):
                      s = m.group(1)
                      if any(is_pseudo_icon_char(ch) for ch in s):
                          shell_ui_glyph_hits.append(f"{p}:{lineno}: {s!r}")
          if shell_ui_glyph_hits:
              sys.exit("Forbidden Unicode pseudo-icons in pion/packages/shell_ui:\n" + "\n".join(shell_ui_glyph_hits))
          print(
              f"Static Shell 2.0 gates passed: 0 .px files, 0 legacy *_view.pion, 0 hand-rolled Glass::liquid, "
              f"100% explicit color_by on ui::Text, 0 app glyphs, 0 shell_ui glyphs, "
              f"ratchet(main_lines={len(main_lines)}/2650, open_decls={open_decls}/261, stage_nodes={stage_nodes}/2)"
          )

          # Static gate 5 (Windows alignment): shared tools/deps.env matches CI workflows and every
          # manifest with native c_sources explicitly declares [link.windows].
          deps_env = {}
          for line in pathlib.Path("tools/deps.env").read_text(encoding="utf-8").splitlines():
              s = line.strip()
              if not s or s.startswith("#") or "=" not in s:
                  continue
              k, v = s.split("=", 1)
              deps_env[k.strip()] = v.strip()
          for req_k in ("PION_REV", "INVAR_REV", "CURL_IMPERSONATE_VER", "NODE_WIN_VER", "WEBVIEW2_VER"):
              if not deps_env.get(req_k):
                  sys.exit(f"Windows alignment gate failed: tools/deps.env missing {req_k}")
          for wf in (pathlib.Path(".github/workflows/pion-ci.yml"), pathlib.Path(".github/workflows/pion-win.yml")):
              wf_txt = wf.read_text(encoding="utf-8")
              if f"PION_REV: {deps_env['PION_REV']}" not in wf_txt or f"ref: {deps_env['PION_REV']}" not in wf_txt:
                  sys.exit(f"Windows alignment gate failed: {wf} PION_REV/ref disagrees with tools/deps.env ({deps_env['PION_REV']})")
          for dep_script in (pathlib.Path("tools/deps_pion.sh"), pathlib.Path("tools/deps_pion_win.ps1")):
              if "deps.env" not in dep_script.read_text(encoding="utf-8"):
                  sys.exit(f"Windows alignment gate failed: {dep_script} must load versions from tools/deps.env")
          missing_win = []
          for p in tomls:
              txt = p.read_text(encoding="utf-8")
              if "c_sources" in txt and "[link.windows]" not in txt:
                  missing_win.append(str(p))
          if missing_win:
              sys.exit(f"Windows alignment gate failed: manifests with c_sources missing [link.windows]: {missing_win}")
          print(f"Windows alignment gate passed: deps.env synced across workflows & scripts, all native manifests declare [link.windows]")
          PY
            if git grep -n -E "still\.fail|stillfail|ui\.monoid|mbui-ui-craft|AFK-surf/monoid|/Users/[A-Za-z0-9._-]+/|codesmith:footer|blacksmith\.sh" -- ':!.github/workflows/pion-ci.yml'; then
              echo "Hygiene gate failed: internal/personal strings found" >&2
              exit 1
            fi
          ) > /tmp/setup-logs/hygiene.log 2>&1 &
          PID_HYG=$!

          PID_APT=""
          if [ "${{ matrix.os }}" = "linux" ]; then
            (
              set -eu
              sudo apt-get update -q
              sudo apt-get install -y -q --no-install-recommends patchelf zlib1g-dev fonts-dejavu-core fonts-liberation2 libegl1 libgl1 libgl1-mesa-dri
            ) > /tmp/setup-logs/apt.log 2>&1 &
            PID_APT=$!
          fi

          SETUP_FAIL=0
          wait "$PID_NODE" || { echo "::error::Fetch libnode failed"; SETUP_FAIL=1; }
          wait "$PID_DEPS" || { echo "::error::Fetch deps_pion failed"; SETUP_FAIL=1; }
          wait "$PID_HYG" || { echo "::error::Hygiene gates failed"; SETUP_FAIL=1; }
          if [ -n "$PID_APT" ]; then
            wait "$PID_APT" || { echo "::error::Linux apt-get failed"; SETUP_FAIL=1; }
          fi

          echo "=== libnode ===" && cat /tmp/setup-logs/libnode.log
          echo "=== deps_pion ===" && cat /tmp/setup-logs/deps_pion.log
          echo "=== hygiene ===" && cat /tmp/setup-logs/hygiene.log
          if [ -f /tmp/setup-logs/apt.log ]; then
            echo "=== apt ===" && tail -n 30 /tmp/setup-logs/apt.log
          fi
          [ "$SETUP_FAIL" -eq 0 ] || exit 1

          # Normalize mtimes on pinned deps and local headers so pionc CAS keys hit across fresh runners
          # (C/header/deps content changes already invalidate the actions/cache key prefix below).
          find deps -type f -exec env TZ=UTC touch -t 202601010000 {} +
          find native pion -type f \( -name '*.h' -o -name '*.hpp' \) -exec env TZ=UTC touch -t 202601010000 {} +

      - name: Cache pionc CAS (incremental objects & packages)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/pion-cas
          key: pion-cas-v4-${{ matrix.name }}-${{ steps.pion-env.outputs.env_fp }}-${{ env.PION_REV }}-${{ hashFiles('tools/deps.env', 'deps/node/include/**', 'native/**', 'pion/**/*.c', 'pion/**/*.cc', 'pion/**/*.h', 'pion/**/*.hpp', '**/c_compat/**') }}-${{ hashFiles('**/pion.toml', 'pion/**/*.pion') }}
          restore-keys: |
            pion-cas-v4-${{ matrix.name }}-${{ steps.pion-env.outputs.env_fp }}-${{ env.PION_REV }}-${{ hashFiles('tools/deps.env', 'deps/node/include/**', 'native/**', 'pion/**/*.c', 'pion/**/*.cc', 'pion/**/*.h', 'pion/**/*.hpp', '**/c_compat/**') }}-

      - name: pionc fmt --check & check (all packages + applicable cmds)
        run: |
          set -eu
          "$PIONC" fmt --check --json pion/packages pion/cmd
          "$PIONC" check --json pion/packages
          if [ "${{ matrix.os }}" = "macos" ]; then
            CMDS="host wpt agent layout app shell_shots docshot probe html5lib jsprobe unpack"
          else
            CMDS="host wpt agent layout probe html5lib jsprobe unpack"
          fi
          CHK_PIDS=""
          CHK_NAMES=""
          CHK_FAIL=0
          for c in $CMDS; do
            "$PIONC" check --json "pion/cmd/$c" &
            CHK_PIDS="$CHK_PIDS $!"
            CHK_NAMES="$CHK_NAMES $c"
            # Limit concurrency to 4 workers
            while [ "$(jobs -rp | wc -l | tr -d ' ')" -ge 4 ]; do
              sleep 0.05
            done
          done
          set -- $CHK_NAMES
          for pid in $CHK_PIDS; do
            cname="$1"; shift
            wait "$pid" || { echo "::error::pionc check failed for pion/cmd/$cname"; CHK_FAIL=1; }
          done
          [ "$CHK_FAIL" -eq 0 ] || exit 1

      - name: pionc test --deps (full workspace unit test suite)
        run: |
          set -eu
          if [ "${{ matrix.os }}" = "macos" ]; then
            export FV_REQUIRE_METAL=1
            export TEST_FLOOR=2199
          else
            export EGL_PLATFORM=surfaceless
            export LIBGL_ALWAYS_SOFTWARE=1
            export TEST_FLOOR=2199
          fi
          # Full workspace unit + shell_ui interaction/a11y/motion test gate (single --deps pass)
          TEST_RC=0
          "$PIONC" test --deps --jobs 4 --json pion/packages > /tmp/pion-test.json || TEST_RC=$?
          export TEST_RC
          python3 - <<'PY'
          import json, os, pathlib, sys
          rc = int(os.environ["TEST_RC"])
          floor = int(os.environ["TEST_FLOOR"])
          raw = pathlib.Path("/tmp/pion-test.json").read_text(encoding="utf-8", errors="replace")
          try:
              s = json.loads(raw)
          except ValueError:
              sys.exit(f"pionc test exited {rc} without a JSON summary; output tail:\n{raw[-4000:]}")
          total = s.get("total", 0)
          passed = s.get("passed", 0)
          failed = s.get("failed", 0)
          deps_skipped = s.get("deps_skipped", 0)
          ok = s.get("ok", False)
          tests = s.get("tests", [])
          shell_ui_tests = [t for t in tests if t.get("pkg") == "shell_ui"]
          has_shell_ui = len(shell_ui_tests) >= 151 and all(t.get("ok") for t in shell_ui_tests)
          has_net = any(t.get("pkg") == "net" for t in tests)
          print(f"pionc test summary: ok={ok}, total={total}, passed={passed}, failed={failed}, deps_skipped={deps_skipped}, floor={floor}, shell_ui={len(shell_ui_tests)}, has_shell_ui={has_shell_ui}, has_net={has_net}")
          for t in tests:
              if not t.get("ok"):
                  print("FAILED:", t)
          if rc != 0 or not ok or failed != 0 or deps_skipped != 0 or passed != total or total < floor or not has_shell_ui or not has_net:
              sys.exit(f"Test gate failed: rc={rc}, ok={ok}, total={total}, floor={floor}, passed={passed}, failed={failed}, deps_skipped={deps_skipped}, shell_ui={len(shell_ui_tests)}, has_shell_ui={has_shell_ui}, has_net={has_net}")
          PY

      - name: Build native binaries, cmd tests, shell_shots, html5lib, and package (parallel)
        run: |
          set -eu
          mkdir -p out /tmp/tail-logs
          if [ "${{ matrix.os }}" = "macos" ]; then
            export FV_REQUIRE_METAL=1
            CMDS="shell_shots host app agent html5lib wpt layout docshot probe jsprobe unpack"
            MAX_BUILD_JOBS=3
          else
            export EGL_PLATFORM=surfaceless
            export LIBGL_ALWAYS_SOFTWARE=1
            CMDS="host agent html5lib wpt layout probe jsprobe unpack"
            MAX_BUILD_JOBS=4
          fi

          # Phase 1: build all native binaries in parallel (shared library deps are already in CAS)
          BLD_PIDS=""
          BLD_NAMES=""
          BLD_FAIL=0
          for c in $CMDS; do
            "$PIONC" build -o "out/pion-$c" "pion/cmd/$c" &
            BLD_PIDS="$BLD_PIDS $!"
            BLD_NAMES="$BLD_NAMES $c"
            while [ "$(jobs -rp | wc -l | tr -d ' ')" -ge "$MAX_BUILD_JOBS" ]; do
              sleep 0.05
            done
          done
          set -- $BLD_NAMES
          for pid in $BLD_PIDS; do
            cname="$1"; shift
            wait "$pid" || { echo "::error::pionc build failed for pion/cmd/$cname"; BLD_FAIL=1; }
          done
          [ "$BLD_FAIL" -eq 0 ] || exit 1
          ls -lh out/

          # Phase 2: overlap disjoint verification lanes (single pionc writer in Lane 1; zero pionc calls in Lanes 2 & 3)
          # Lane 1: cmd/host + (macOS) cmd/app unit tests
          (
            set -eu
            "$PIONC" test pion/cmd/host
            if [ "${{ matrix.os }}" = "macos" ]; then
              "$PIONC" test pion/cmd/app
            fi
          ) > /tmp/tail-logs/cmd-tests.log 2>&1 &
          PID_CMD_TESTS=$!

          # Lane 2: (macOS) app MT selftest + html5lib conformance + self-contained tarball packaging & clean-env smoke
          (
            set -eu
            if [ "${{ matrix.os }}" = "macos" ]; then
              FV_APP_SELFTEST_MT=1 out/pion-app
            fi
            out/pion-html5lib --list-failures tests/html5lib/tree-construction/*.dat > /tmp/html5lib.out
            python3 - <<'PY'
          import pathlib, re, sys
          txt = pathlib.Path("/tmp/html5lib.out").read_text(encoding="utf-8")
          if "read failed:" in txt:
              sys.exit("html5lib encountered read_errors")
          m = re.search(r'(?m)^pass\s+(\d+)\s+fail\s+(\d+)\s*$', txt)
          if not m:
              sys.exit("Missing html5lib summary line")
          p, f = int(m.group(1)), int(m.group(2))
          actual = sorted(
              line.removeprefix("FAIL_KEY ").strip()
              for line in txt.splitlines()
              if line.startswith("FAIL_KEY ")
          )
          if len(actual) != f:
              sys.exit(f"FAIL_KEY count mismatch: listed {len(actual)} vs reported fail={f}")
          baseline_path = pathlib.Path("tests/html5lib/known-failures.txt")
          baseline = sorted(
              line.strip()
              for line in baseline_path.read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.strip().startswith("#")
          )
          unexpected = sorted(set(actual) - set(baseline))
          fixed = sorted(set(baseline) - set(actual))
          print(f"html5lib summary: pass={p}, fail={f}, baseline={len(baseline)}, fixed={len(fixed)}")
          if p < 3533:
              sys.exit(f"html5lib regression: pass={p} (<3533)")
          if unexpected:
              sys.exit(f"html5lib new failures outside baseline ({len(unexpected)}): {unexpected}")
          PY
            FV_PREBUILT_DIR=out bash tools/package_pion.sh
            rm -rf /tmp/smoke && mkdir -p /tmp/smoke
            tar -xzf dist/farview-pion-*.tar.gz -C /tmp/smoke
            D=$(echo /tmp/smoke/farview-pion-*)
            test -f "$D/LICENSE"
            test -f "$D/THIRD_PARTY_NOTICES.md"
            test -f "$D/LICENSES/Node.js-LICENSE.txt"
            test -f "$D/LICENSES/invar-NOTICE.txt"
            test -f "$D/LICENSES/invar-THIRD_PARTY_NOTICES.md"
            test -f "$D/LICENSES/curl-impersonate/LICENSE"
            if [ "${{ matrix.os }}" = "macos" ]; then
              ls "$D/lib/"libnode*.dylib >/dev/null
              if otool -L "$D/bin/host" "$D/bin/agent" "$D/lib/"* | grep -q '@rpath/'; then
                echo "Unexpected @rpath/ reference in packaged macOS artifacts" >&2
                exit 1
              fi
            else
              if ls "$D/lib/"libstdc++.so* "$D/lib/"libgcc_s.so* >/dev/null 2>&1; then
                echo "Unexpected bundled libstdc++/libgcc_s in Linux tarball" >&2
                exit 1
              fi
            fi
            TAB_URL="file://$PWD/tests/host/tab.html"
            (
              cd /tmp/smoke
              env -i PATH="/usr/bin:/bin" HOME=/tmp/smoke \
                "$D/bin/host" --tab 27590 "$TAB_URL" > /tmp/smoke/host.out 2>&1 &
              HPID=$!
              trap 'kill $HPID 2>/dev/null || true' EXIT
              for _ in $(seq 1 50); do nc -z 127.0.0.1 27591 2>/dev/null && break; sleep 0.2; done
              OUT=$(env -i PATH="/usr/bin:/bin" HOME=/tmp/smoke \
                "$D/bin/agent" 127.0.0.1 27591 "eval:1+41" "eval:document.title")
              echo "$OUT"
              echo "$OUT" | grep -qx '42'
              kill $HPID 2>/dev/null || true
            )
          ) > /tmp/tail-logs/pkg-smoke.log 2>&1 &
          PID_PKG=$!

          # Lane 3 (macOS): 4 balanced shot-level shards covering 100% of all 441 Metal @2x PNGs + WCAG & split-border gate
          PID_SHOTS=""
          if [ "${{ matrix.os }}" = "macos" ]; then
            (
              set -eu
              rm -rf /tmp/fv-shell-shots && mkdir -p /tmp/fv-shell-shots
              SHARD_PIDS=""
              for si in 0 1 2 3; do
                FV_SHOTS_SHARD="${si}/4" FV_SHELL_SHOTS_DIR=/tmp/fv-shell-shots out/pion-shell_shots &
                SHARD_PIDS="$SHARD_PIDS $!"
              done
              SHOT_FAIL=0
              for spid in $SHARD_PIDS; do
                wait "$spid" || SHOT_FAIL=1
              done
              if [ "$SHOT_FAIL" -ne 0 ]; then
                echo "shell_shots failed in one or more parallel shards" >&2
                exit 1
              fi
              python3 - <<'PY'
          import json, pathlib, struct, subprocess, sys, tempfile
          expected = [
              "01-light-1280.png",
              "02-dark-1280.png",
              "03-split-1280.png",
              "04-omnibox-open-light.png",
              "05-omnibox-open-dark.png",
              "06-omnibox-open-colorful.png",
              "07-drawer-open-1280.png",
              "08-narrow-760.png",
              "09-compact-480.png",
              "10-compact-480-inset.png",
              "11-dialog-open-1280.png",
              "12-light-1280-inset.png",
          ]
          d = pathlib.Path("/tmp/fv-shell-shots")
          all_pngs = sorted(p for p in d.glob("*.png") if p.stat().st_size >= 512)
          if len(all_pngs) < 441:
              sys.exit(f"shell_shots coverage drop: expected >= 441 non-empty PNGs, got {len(all_pngs)}")
          missing = [f for f in expected if not (d / f).is_file() or (d / f).stat().st_size < 1024]
          if missing:
              sys.exit(f"shell_shots missing/empty PNGs: {missing}")
          manifest_p = d / "shots_manifest.json"
          if not manifest_p.is_file():
              sys.exit("shell_shots missing shots_manifest.json")
          manifest = json.loads(manifest_p.read_text(encoding="utf-8"))

          def open_png_bmp(path):
              with tempfile.NamedTemporaryFile(suffix=".bmp") as tmp:
                  subprocess.run(
                      ["/usr/bin/sips", "-s", "format", "bmp", str(path), "--out", tmp.name],
                      check=True,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
                  data = pathlib.Path(tmp.name).read_bytes()
              assert data[:2] == b"BM"
              off, dib_sz, w, h, _planes, bpp, comp = struct.unpack_from("<IIiiHHI", data, 10)
              assert bpp in (24, 32), f"Unexpected BMP bpp={bpp}"
              if comp == 3:
                  assert dib_sz >= 52, f"BI_BITFIELDS with short DIB header {dib_sz}"
                  rm, gm, bm = struct.unpack_from("<III", data, 54)
                  assert (rm, gm, bm) == (0x00FF0000, 0x0000FF00, 0x000000FF), f"Unexpected masks {(hex(rm), hex(gm), hex(bm))}"
              else:
                  assert comp == 0, f"Unexpected BMP compression={comp}"
              top_down = h < 0
              h = abs(h)
              step = bpp // 8
              stride = ((w * step + 3) // 4) * 4
              return w, h, step, stride, off, top_down, data

          _LIN = [
              (c / 255.0) / 12.92 if (c / 255.0) <= 0.04045 else (((c / 255.0) + 0.055) / 1.055) ** 2.4
              for c in range(256)
          ]
          def rel_lum(r, g, b):
              return 0.2126 * _LIN[r] + 0.7152 * _LIN[g] + 0.0722 * _LIN[b]

          bands = manifest["omnibox_bands"]
          assert len(bands) == 9, f"Expected 9 omnibox bands, got {len(bands)}"
          for fname, is_dark in [
              ("04-omnibox-open-light.png", False),
              ("05-omnibox-open-dark.png", True),
              ("06-omnibox-open-colorful.png", False),
          ]:
              w, h, step, stride, off, top_down, px = open_png_bmp(d / fname)
              min_r = 999.0
              for name, (x0, y0, x1, y1) in bands.items():
                  lums = []
                  for y in range(max(0, y0), min(h, y1)):
                      sy = y if top_down else (h - 1 - y)
                      base = off + sy * stride
                      for x in range(max(0, x0), min(w, x1)):
                          idx = base + x * step
                          lums.append(rel_lum(px[idx + 2], px[idx + 1], px[idx]))
                  lums.sort()
                  n = len(lums)
                  # "*_selected" bands are white text on the palette's selected (Space-colored) row: light on dark.
                  inverted = is_dark or name.endswith("_selected")
                  bg = lums[int(n * 0.10)] if inverted else lums[int(n * 0.90)]
                  fg = lums[int(n * 0.995)] if inverted else lums[int(n * 0.005)]
                  ratio = (max(bg, fg) + 0.05) / (min(bg, fg) + 0.05)
                  min_r = min(min_r, ratio)
                  print(f"  {fname} {name:26s}: bg={bg:.3f} fg={fg:.3f} ratio={ratio:.2f}:1")
                  if ratio < 4.5:
                      sys.exit(f"WCAG contrast gate failed on {fname} ({name}): {ratio:.2f}:1 < 4.5:1")
              print(f"shell_shots pixel contrast OK: {fname} min_ratio={min_r:.2f}:1")

          # Verify 03-split-1280.png active pane blue accent border is visibly painted ABOVE content on left, top, right edges
          sw, sh, sstep, sstride, soff, stop_down, spx = open_png_bmp(d / "03-split-1280.png")
          sx0, sy0, sx1, sy1 = manifest["split_active_pane"]
          def count_blue(xs, ys):
              hits = 0
              for y in ys:
                  if 0 <= y < sh:
                      sy = y if stop_down else (sh - 1 - y)
                      base = soff + sy * sstride
                      for x in xs:
                          if 0 <= x < sw:
                              idx = base + x * sstep
                              r, g, b = spx[idx + 2], spx[idx + 1], spx[idx]
                              if b > r + 40 and b > 140:
                                  hits += 1
              return hits
          mid_y = (sy0 + sy1) // 2
          mid_x = (sx0 + sx1) // 2
          left_blue = count_blue(range(sx0 - 4, sx0 + 8), range(mid_y - 60, mid_y + 60, 2))
          top_blue = count_blue(range(mid_x - 60, mid_x + 60, 2), range(sy0 - 4, sy0 + 8))
          right_blue = count_blue(range(sx1 - 8, sx1 + 4), range(mid_y - 60, mid_y + 60, 2))
          print(f"03-split-1280 active border blue pixels: left={left_blue}, top={top_blue}, right={right_blue}")
          if left_blue < 20 or top_blue < 20 or right_blue < 20:
              sys.exit(f"Split active blue border not visible on all 3 edges: left={left_blue}, top={top_blue}, right={right_blue}")
          print(f"shell_shots gate passed: {len(all_pngs)} Metal @2x PNGs ({len(expected)}/12 core scenes), contrast >= 4.5:1, split border OK")
          PY
            ) > /tmp/tail-logs/shell-shots.log 2>&1 &
            PID_SHOTS=$!
          fi

          TAIL_FAIL=0
          wait "$PID_CMD_TESTS" || { echo "::error::cmd/host or cmd/app tests failed"; TAIL_FAIL=1; }
          wait "$PID_PKG" || { echo "::error::html5lib, packaging, or smoke test failed"; TAIL_FAIL=1; }
          if [ -n "$PID_SHOTS" ]; then
            wait "$PID_SHOTS" || { echo "::error::shell_shots or WCAG gate failed"; TAIL_FAIL=1; }
          fi

          echo "=== cmd tests ===" && cat /tmp/tail-logs/cmd-tests.log
          echo "=== html5lib + package + smoke ===" && cat /tmp/tail-logs/pkg-smoke.log
          if [ -f /tmp/tail-logs/shell-shots.log ]; then
            echo "=== shell_shots (tail) ===" && grep -v '^shell_shots: wrote ' /tmp/tail-logs/shell-shots.log || true
          fi
          du -sh "$PION_CACHE_DIR" "$PION_CACHE_DIR"/* 2>/dev/null || true
          [ "$TAIL_FAIL" -eq 0 ] || exit 1
